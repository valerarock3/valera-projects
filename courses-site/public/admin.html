<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">🎓 Курсы</a>
    <div class="nav-links" id="nav-links"></div>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </nav>

  <div class="container">
    <h1 class="page-title" data-i18n="adminPanel">⚙ Админ-панель</h1>
    <div id="admin-body" class="admin-layout">
      <div class="admin-menu">
        <button class="active" data-panel="courses">📚 <span data-i18n="courses">Курсы</span></button>
        <button data-panel="lessons">📝 <span data-i18n="lessonsAdmin">Уроки</span></button>
        <button data-panel="media">🎞 <span data-i18n="mediaTitle">Медиа</span></button>
        <button data-panel="categories">🗂 <span data-i18n="categories">Категории</span></button>
        <button data-panel="instructors">👨‍🏫 <span data-i18n="instructors">Преподаватели</span></button>
        <button data-panel="products">🛍 <span data-i18n="products">Товары</span></button>
        <button data-panel="services">💆 <span data-i18n="services">Услуги</span></button>
        <button data-panel="consultations">📞 <span data-i18n="consultation">Консультации</span></button>
        <button data-panel="requests">📨 <span data-i18n="requests">Заявки</span></button>
        <button data-panel="payments">💳 <span data-i18n="payments">Оплаты</span></button>
        <button data-panel="users">👥 <span data-i18n="users">Пользователи</span></button>
        <button data-panel="settings">⚙ <span data-i18n="settings">Настройки</span></button>
      </div>
      <div class="admin-panel" id="admin-panel"><div class="loading">Загрузка...</div></div>
    </div>
  </div>

  <script src="translations.js"></script>
  <script src="common.js"></script>
  <script>
    let currentPanel = "courses";
    let allCategories = [];
    let allCourses = [];
    let allInstructors = [];
    let me = null;
    let editingCourseId = null;
    let editingInstructorId = null;
    let editingLessonId = null;

    async function checkAdmin() {
      me = await fetchMe();
      if (!me) { window.location.href = "login.html"; return false; }
      if (me.role !== "admin") {
        document.getElementById("admin-body").innerHTML = `<div class="empty">${t("accessDenied")}</div>`;
        return false;
      }
      return true;
    }

    document.querySelectorAll(".admin-menu button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".admin-menu button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentPanel = btn.dataset.panel;
        loadPanel();
      });
    });

    async function loadPanel() {
      const ok = await checkAdmin();
      if (!ok) return;
      editingSectionId = null;
      expandedImagesId = null;
      const panel = document.getElementById("admin-panel");
      panel.innerHTML = `<div class="loading">${t("loading")}</div>`;
      if (currentPanel === "courses") {
        allCategories = await apiFetch("/api/categories");
        allCourses = await apiFetch("/api/courses");
        allInstructors = await apiFetch("/api/admin/instructors");
        renderCourses(panel);
      } else if (currentPanel === "lessons") {
        allCategories = await apiFetch("/api/categories");
        allCourses = await apiFetch("/api/courses");
        renderLessons(panel);
      } else if (currentPanel === "media") {
        allCategories = await apiFetch("/api/categories");
        allCourses = await apiFetch("/api/courses");
        renderMedia(panel);
      } else if (currentPanel === "categories") {
        allCategories = await apiFetch("/api/categories");
        renderCategories(panel);
      } else if (currentPanel === "instructors") {
        allInstructors = await apiFetch("/api/admin/instructors");
        renderInstructors(panel);
      } else if (currentPanel === "products") {
        allInstructors = await apiFetch("/api/admin/instructors");
        await renderSection(panel, SECTION_PRODUCT);
      } else if (currentPanel === "services") {
        allInstructors = await apiFetch("/api/admin/instructors");
        await renderSection(panel, SECTION_SERVICE);
      } else if (currentPanel === "consultations") {
        allInstructors = await apiFetch("/api/admin/instructors");
        await renderSection(panel, SECTION_CONSULTATION);
      } else if (currentPanel === "requests") {
        const requests = await apiFetch("/api/admin/requests");
        renderRequests(panel, requests);
      } else if (currentPanel === "payments") {
        const payments = await apiFetch("/api/admin/payments");
        renderPayments(panel, payments);
      } else if (currentPanel === "users") {
        allCourses = await apiFetch("/api/courses");
        const users = await apiFetch("/api/admin/users");
        renderUsers(panel, users);
      } else if (currentPanel === "settings") {
        const cfg = await apiFetch("/api/site-config");
        renderSettings(panel, cfg);
      }
      applyI18n();
    }

    function renderCourses(panel) {
      panel.innerHTML = `
        <div class="panel-title">${t("courses")} (${allCourses.length})</div>
        <div class="admin-form">
          <h4 id="c-form-title">${t("addCourse")}</h4>
          <div class="form-group"><label>${t("title")}</label><input id="c-title"></div>
          <div class="form-group"><label>${t("description")}</label><textarea id="c-desc"></textarea></div>
          <div class="form-group"><label>${t("price")}</label><input type="number" id="c-price" value="0"></div>
          <div class="form-group"><label>${t("category")}</label><select id="c-cat"><option value="">${t("noCategoryOpt")}</option>${allCategories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("")}</select></div>
          <div class="form-group"><label>${t("instructorField")}</label><select id="c-instr">
            <option value="">${t("noInstructor")}</option>
            ${allInstructors.map(i => `<option value="${i.id}">${escapeHtml(i.name)}</option>`).join("")}
          </select></div>
          <div class="form-group"><label>${t("imageUrl")}</label><input id="c-img" placeholder="https://..."></div>
          <div class="drop-zone" id="dz-course-img">
            <div class="dz-text">🖼 ${t("dragImage")}</div>
            <div class="dz-preview"></div>
            <div class="dz-status"></div>
          </div>
          <div class="drop-zone" id="dz-course-gallery">
            <div class="dz-text">🎞 ${t("dragMediaMulti")}</div>
            <div class="dz-status"></div>
          </div>
          <div class="gallery-after-save">💡 ${t("galleryAfterSave")}</div>
          <div id="dz-course-pending"></div>
          <div class="form-actions">
            <button class="btn btn-primary" id="c-save">${t("save")}</button>
            <button class="btn btn-outline hidden" id="c-cancel">✕ ${t("cancel")}</button>
          </div>
        </div>
        ${allCourses.map(c => `
          <div class="admin-row">
            <div>
              <div class="ar-title">${escapeHtml(c.title)} <span style="color:var(--text-faint);font-size:12px">(${fmtPrice(c.price)})</span></div>
              <div class="ar-sub">${escapeHtml(c.category_name) || t("noCategoryOpt")} · ${c.lessons_count || 0} ${pluralLessons(c.lessons_count || 0)} · ${t("instructorWord")}: ${escapeHtml(c.instructor) || "—"}</div>
            </div>
            <div class="ar-actions">
              <button class="btn btn-outline btn-sm" data-edit="${c.id}">${t("lessonsBtn")}</button>
              <button class="btn btn-outline btn-sm" data-editcourse="${c.id}">✏ ${t("edit")}</button>
              <button class="btn btn-danger btn-sm" data-del="${c.id}">${t("delete")}</button>
            </div>
          </div>`).join("")}
      `;
      document.getElementById("c-save").addEventListener("click", async () => {
        const btn = document.getElementById("c-save");
        btn.disabled = true;
        try {
          const payload = {
            title: document.getElementById("c-title").value,
            description: document.getElementById("c-desc").value,
            price: document.getElementById("c-price").value,
            category_id: document.getElementById("c-cat").value || null,
            instructor_id: document.getElementById("c-instr").value ? Number(document.getElementById("c-instr").value) : null,
            instructor: document.getElementById("c-instr").selectedOptions.length ? document.getElementById("c-instr").selectedOptions[0].text : "",
            image_url: document.getElementById("c-img").value,
          };
          let created;
          if (editingCourseId) {
            created = await apiFetch(`/api/admin/courses/${editingCourseId}`, {
              method: "PUT", headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
          } else {
            created = await apiFetch("/api/admin/courses", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
          }
          if (pendingCourseFiles.length) {
            const cid = editingCourseId || created.id;
            const status = document.getElementById("dz-course-gallery").querySelector(".dz-status");
            for (let i = 0; i < pendingCourseFiles.length; i++) {
              status.textContent = t("uploading") + ` (${i + 1}/${pendingCourseFiles.length})`;
              status.className = "dz-status";
              const fd = new FormData();
              fd.append("file", pendingCourseFiles[i]);
              const res = await fetch("/api/upload", { method: "POST", body: fd });
              const data = await res.json();
              if (!res.ok) throw new Error(translateError(data.error) || "Error");
              await apiFetch(`/api/admin/courses/${cid}/media`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ url: data.url }),
              });
            }
            status.textContent = "✔ " + t("uploaded") + " " + pendingCourseFiles.length + " " + t("filesWord");
            status.className = "dz-status ok";
          }
          pendingCourseFiles.length = 0;
          editingCourseId = null;
        } finally {
          btn.disabled = false;
          loadPanel();
        }
      });
      document.getElementById("c-cancel").addEventListener("click", () => {
        editingCourseId = null;
        loadPanel();
      });
      panel.querySelectorAll("[data-editcourse]").forEach(btn => {
        btn.addEventListener("click", () => {
          const cid = Number(btn.dataset.editcourse);
          const course = allCourses.find(c => c.id === cid);
          if (!course) return;
          editingCourseId = cid;
          document.getElementById("c-form-title").textContent = t("editCourse") + ": " + course.title;
          document.getElementById("c-title").value = course.title;
          document.getElementById("c-desc").value = course.description || "";
          document.getElementById("c-price").value = course.price;
          document.getElementById("c-cat").value = course.category_id || "";
          if (course.instructor_id) {
            document.getElementById("c-instr").value = course.instructor_id;
          } else if (course.instructor) {
            const opt = [...document.getElementById("c-instr").options].find(o => o.text === course.instructor);
            if (opt) document.getElementById("c-instr").value = opt.value;
          }
          document.getElementById("c-img").value = course.image_url || "";
          document.getElementById("c-cancel").classList.remove("hidden");
          document.getElementById("c-save").textContent = t("saveChanges");
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
      const pendingCourseFiles = renderCoursesGallery();
      panel.querySelectorAll("[data-del]").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm(t("confirmDeleteCourse"))) return;
          await apiFetch(`/api/admin/courses/${btn.dataset.del}`, { method: "DELETE" });
          loadPanel();
        });
      });
      panel.querySelectorAll("[data-edit]").forEach(btn => {
        btn.addEventListener("click", () => {
          const cid = Number(btn.dataset.edit);
          if (!allCourses.some(c => c.id === cid)) return;
          const menuBtn = document.querySelector('.admin-menu button[data-panel="lessons"]');
          menuBtn.click();
          setTimeout(() => { const sel = document.getElementById("l-course"); if (sel) { sel.value = cid; sel.dispatchEvent(new Event("change")); } }, 100);
        });
      });
      makeDropZone("dz-course-img", "c-img", "image/*");
    }

    function renderCoursesGallery() {
      const pending = [];
      const zone = document.getElementById("dz-course-gallery");
      if (!zone) return pending;
      const status = zone.querySelector(".dz-status");
      const fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.hidden = true;
      fileInput.multiple = true;
      fileInput.accept = "image/*,video/*,audio/*";
      zone.appendChild(fileInput);

      zone.addEventListener("click", () => fileInput.click());
      zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("drag"); });
      zone.addEventListener("dragleave", () => zone.classList.remove("drag"));
      zone.addEventListener("drop", (e) => {
        e.preventDefault();
        zone.classList.remove("drag");
        if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
      });
      fileInput.addEventListener("change", () => {
        if (fileInput.files.length) addFiles(fileInput.files);
        fileInput.value = "";
      });

      function addFiles(fileList) {
        for (const file of fileList) {
          if (["image", "video", "audio"].some(p => file.type.startsWith(p + "/"))) {
            pending.push(file);
          } else {
            status.textContent = t("uploadBadType");
            status.className = "dz-status bad";
          }
        }
        renderPending();
      }

      function renderPending() {
        const box = document.getElementById("dz-course-pending");
        if (!box) return;
        box.innerHTML = pending.length ? pending.map((f, i) => `
          <div class="pf-row">
            <span class="pf-icon">${f.type.startsWith("image/") ? "🖼" : f.type.startsWith("video/") ? "🎬" : "🎵"}</span>
            <span class="pf-name">${escapeHtml(f.name)}</span>
            <button class="btn btn-danger btn-sm" data-rm="${i}">${t("delete")}</button>
          </div>`).join("") : "";
        box.querySelectorAll("[data-rm]").forEach(btn => btn.addEventListener("click", () => {
          pending.splice(Number(btn.dataset.rm), 1);
          renderPending();
        }));
      }
      return pending;
    }

    function renderLessons(panel) {
      panel.innerHTML = `
        <div class="panel-title">${t("lessonsAdmin")}</div>
        <div class="form-group"><label>${t("chooseCourse")}</label><select id="l-course">
          ${allCourses.map(c => `<option value="${c.id}">${escapeHtml(c.title)}</option>`).join("")}
        </select></div>
        <div class="admin-form">
          <h4>${t("addLesson")}</h4>
          <div class="form-group"><label>${t("lessonTitle")}</label><input id="l-title"></div>
          <div class="form-group"><label>${t("content")}</label><textarea id="l-content" placeholder="${t("contentPh")}"></textarea></div>
          <div class="form-group"><label>${t("videoUrl")}</label><input id="l-video" placeholder="${t("videoUrlPh")}"></div>
          <div class="drop-zone" id="dz-lesson-media">
            <div class="dz-text">🎬 ${t("dragMedia")}</div>
            <div class="dz-preview"></div>
            <div class="dz-status"></div>
          </div>
          <div class="form-group"><label>${t("lessonImage")}</label><input id="l-image" placeholder="https://..."></div>
          <div class="drop-zone" id="dz-lesson-img">
            <div class="dz-text">🖼 ${t("dragImage")}</div>
            <div class="dz-preview"></div>
            <div class="dz-status"></div>
          </div>
          <div class="form-group"><label>${t("duration")}</label><input type="number" id="l-dur" value="30"></div>

          <div class="quiz-editor">
            <h4>${t("quizTitle")}</h4>
            <div class="form-group">
              <label>${t("quizTextLabel")}</label>
              <textarea id="l-quiz-text" placeholder="${t("quizTextPh")}"></textarea>
            </div>
            <div class="quiz-tools">
              <button class="btn btn-outline btn-sm" id="l-quiz-import">📂 ${t("quizImportFile")}</button>
              <button class="btn btn-outline btn-sm" id="l-quiz-parse">⚙ ${t("quizParse")}</button>
              <button class="btn btn-danger btn-sm" id="l-quiz-clear">${t("quizClear")}</button>
            </div>
            <input type="file" id="l-quiz-file" hidden accept=".txt,.json,text/plain,application/json">
            <div id="l-quiz-preview"></div>
            <input type="hidden" id="l-quiz-json">
          </div>

          <button class="btn btn-primary" id="l-save">${t("save")}</button>
        </div>
        <div id="l-list"><div class="loading">${t("loading")}</div></div>
      `;
      const courseSelect = document.getElementById("l-course");
      const loadLessons = async () => {
        const cid = courseSelect.value;
        if (!cid) { document.getElementById("l-list").innerHTML = ""; return; }
        const course = await apiFetch(`/api/courses/${cid}`);
        document.getElementById("l-list").innerHTML = course.lessons.map(l => `
          <div class="admin-row">
            <div>
              <div class="ar-title">${l.position + 1}. ${escapeHtml(l.title)}</div>
              <div class="ar-sub">⏱ ${l.duration_min || 0} ${t("min")}${l.video_url ? " · 🎬 " + t("videoYes") : ""}${l.image_url ? " · 🖼 " + t("imageYes") : ""}${l.quiz && l.quiz.length ? " · 📝 " + t("quizQuestionsCount") + ": " + l.quiz.length : ""}</div>
            </div>
            <div class="ar-actions"><button class="btn btn-outline btn-sm" data-edit="${l.id}">${t("edit")}</button> <button class="btn btn-danger btn-sm" data-del="${l.id}">${t("delete")}</button></div>
          </div>`).join("") || `<div class="empty">${t("lessonNo")}</div>`;
        document.getElementById("l-list").querySelectorAll("[data-del]").forEach(btn => {
          btn.addEventListener("click", async () => {
            await apiFetch(`/api/admin/lessons/${btn.dataset.del}`, { method: "DELETE" });
            loadLessons();
          });
        });
        document.getElementById("l-list").querySelectorAll("[data-edit]").forEach(btn => {
          btn.addEventListener("click", async () => {
            const cid = courseSelect.value;
            const course = await apiFetch(`/api/courses/${cid}`);
            const lesson = course.lessons.find(l => l.id === Number(btn.dataset.edit));
            if (!lesson) return;
            editingLessonId = lesson.id;
            document.getElementById("l-title").value = lesson.title || "";
            document.getElementById("l-content").value = lesson.content || "";
            document.getElementById("l-video").value = lesson.video_url || "";
            document.getElementById("l-image").value = lesson.image_url || "";
            document.getElementById("l-dur").value = lesson.duration_min || 30;
            if (lesson.quiz) {
              quizJsonInput().value = typeof lesson.quiz === "string" ? lesson.quiz : JSON.stringify(lesson.quiz);
              renderQuizPreview();
            }
            document.getElementById("l-save").textContent = t("save");
            document.getElementById("l-title").focus();
          });
        });
      };
      courseSelect.addEventListener("change", loadLessons);

      const quizJsonInput = () => document.getElementById("l-quiz-json");

      document.getElementById("l-quiz-file").addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const text = await file.text();
        if (file.name.endsWith(".json")) {
          try {
            const data = JSON.parse(text);
            const arr = Array.isArray(data) ? data : (data.questions || []);
            quizJsonInput().value = JSON.stringify(arr);
            renderQuizPreview();
          } catch {
            document.getElementById("l-quiz-preview").innerHTML = `<div class="empty" style="color:var(--danger-text)">${t("quizJsonBad")}</div>`;
          }
        } else {
          document.getElementById("l-quiz-text").value = text;
          parseQuizNow();
        }
      });
      document.getElementById("l-quiz-import").addEventListener("click", () => document.getElementById("l-quiz-file").click());
      document.getElementById("l-quiz-parse").addEventListener("click", parseQuizNow);
      document.getElementById("l-quiz-clear").addEventListener("click", () => {
        document.getElementById("l-quiz-text").value = "";
        document.getElementById("l-quiz-json").value = "";
        document.getElementById("l-quiz-preview").innerHTML = "";
      });

      function parseQuizNow() {
        const text = document.getElementById("l-quiz-text").value || "";
        const questions = parseQuizText(text);
        quizJsonInput().value = questions.length ? JSON.stringify(questions) : "";
        renderQuizPreview(questions);
      }

      function renderQuizPreview(qs) {
        const questions = qs || (() => { try { return JSON.parse(quizJsonInput().value || "[]"); } catch { return []; } })();
        document.getElementById("l-quiz-preview").innerHTML = questions.length
          ? `<div class="quiz-preview-head">${t("quizParsed")}: ${questions.length}</div>` +
            questions.map((q, i) => `
              <div class="quiz-preview-item">
                <div class="qp-q">${i + 1}. ${escapeHtml(q.q)}</div>
                ${q.options.map((o, j) => `<div class="qp-o ${j === q.correct ? "correct" : ""}">${j === q.correct ? "✔" : "•"} ${escapeHtml(o)}</div>`).join("")}
              </div>`).join("")
          : `<div class="empty">${t("quizNoQuestions")}</div>`;
      }

      document.getElementById("l-save").addEventListener("click", async () => {
        let quiz = quizJsonInput().value;
        if (!quiz) { parseQuizNow(); quiz = quizJsonInput().value; }
        const body = {
          title: document.getElementById("l-title").value,
          content: document.getElementById("l-content").value,
          duration_min: document.getElementById("l-dur").value,
          video_url: document.getElementById("l-video").value,
          image_url: document.getElementById("l-image").value,
          quiz: quiz || null,
        };
        if (editingLessonId) {
          await apiFetch(`/api/admin/lessons/${editingLessonId}`, {
            method: "PUT", headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          editingLessonId = null;
          document.getElementById("l-save").textContent = t("save");
        } else {
          await apiFetch(`/api/admin/courses/${courseSelect.value}/lessons`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
        }
        document.getElementById("l-title").value = "";
        document.getElementById("l-content").value = "";
        document.getElementById("l-video").value = "";
        document.getElementById("l-image").value = "";
        document.getElementById("l-quiz-text").value = "";
        document.getElementById("l-quiz-json").value = "";
        document.getElementById("l-quiz-preview").innerHTML = "";
        document.querySelectorAll(".dz-preview").forEach(p => p.innerHTML = "");
        document.querySelectorAll(".dz-status").forEach(s => { s.textContent = ""; s.className = "dz-status"; });
        loadLessons();
      });
      loadLessons();
      makeDropZone("dz-lesson-media", "l-video", "video/*,audio/*");
      makeDropZone("dz-lesson-img", "l-image", "image/*");
    }

    function parseQuizText(text) {
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      const questions = [];
      let current = null;
      for (const line of lines) {
        const isOption = /^[-*+•◦・✓✔]/.test(line);
        if (!isOption) {
          current = { q: line.replace(/^\d+[.)]\s*/, ""), options: [], correct: -1 };
          questions.push(current);
        } else if (current) {
          const correct = /^[*+]/.test(line);
          const opt = line
            .replace(/^[-*+•◦・✓✔]\s*/, "")
            .replace(/\s*\((?:правильный|верный|correct)\)\s*$/i, "")
            .trim();
          current.options.push(opt);
          if (correct) current.correct = current.options.length - 1;
        }
      }
      return questions.filter(q => q.q && q.options.length >= 2);
    }

    function renderMedia(panel) {
      panel.innerHTML = `
        <div class="panel-title">${t("mediaTitle")}</div>
        <div class="form-group"><label>${t("chooseCourse")}</label><select id="m-course">
          ${allCourses.map(c => `<option value="${c.id}">${escapeHtml(c.title)}</option>`).join("")}
        </select></div>
        <div class="drop-zone" id="dz-media">
          <div class="dz-text">🎞 ${t("dragMediaMulti")}</div>
          <div class="dz-status"></div>
        </div>
        <div id="m-list"><div class="loading">${t("loading")}</div></div>
      `;
      const courseSelect = document.getElementById("m-course");
      const loadMedia = async () => {
        const cid = courseSelect.value;
        if (!cid) { document.getElementById("m-list").innerHTML = ""; return; }
        const course = await apiFetch(`/api/courses/${cid}`);
        const media = course.media || [];
        document.getElementById("m-list").innerHTML = media.length
          ? `<div class="media-grid">` + media.map(m => `
              <div class="media-card">
                <div class="media-thumb">${thumbHtml(m)}</div>
                <div class="media-actions">
                  <span class="media-type">${typeLabel(m.type)}</span>
                  <button class="btn btn-danger btn-sm" data-del="${m.id}">${t("delete")}</button>
                </div>
              </div>`).join("") + `</div>`
          : `<div class="empty">${t("mediaEmpty")}</div>`;
        document.getElementById("m-list").querySelectorAll("[data-del]").forEach(btn => {
          btn.addEventListener("click", async () => {
            await apiFetch(`/api/admin/media/${btn.dataset.del}`, { method: "DELETE" });
            loadMedia();
          });
        });
      };
      courseSelect.addEventListener("change", loadMedia);

      const zone = document.getElementById("dz-media");
      const status = zone.querySelector(".dz-status");
      const fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.hidden = true;
      fileInput.multiple = true;
      fileInput.accept = "image/*,video/*,audio/*";
      zone.appendChild(fileInput);
      zone.addEventListener("click", () => fileInput.click());
      zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("drag"); });
      zone.addEventListener("dragleave", () => zone.classList.remove("drag"));
      zone.addEventListener("drop", (e) => {
        e.preventDefault();
        zone.classList.remove("drag");
        if (e.dataTransfer.files.length) uploadMany([...e.dataTransfer.files]);
      });
      fileInput.addEventListener("change", () => {
        if (fileInput.files.length) uploadMany([...fileInput.files]);
        fileInput.value = "";
      });

      async function uploadMany(files) {
        const cid = courseSelect.value;
        if (!cid) { alert(t("chooseCourse")); return; }
        let ok = 0;
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          if (!["image", "video", "audio"].some(p => file.type.startsWith(p + "/"))) continue;
          status.textContent = t("uploading") + ` (${ok + 1}/${files.length})`;
          status.className = "dz-status";
          try {
            const fd = new FormData();
            fd.append("file", file);
            const res = await fetch("/api/upload", { method: "POST", body: fd });
            const data = await res.json();
            if (!res.ok) throw new Error(translateError(data.error) || "Error");
            await apiFetch(`/api/admin/courses/${cid}/media`, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ url: data.url }),
            });
            ok++;
          } catch (err) {
            status.textContent = err.message;
            status.className = "dz-status bad";
            break;
          }
        }
        status.textContent = ok ? `✔ ${t("uploaded")} ${ok} ${t("filesWord")}` : status.textContent;
        status.className = ok ? "dz-status ok" : status.className;
        loadMedia();
      }
      loadMedia();
    }

      if (type === "video") return "🎬 " + t("videoYes");

    }

    function makeDropZone(zoneId, inputId, accept) {
      const zone = document.getElementById(zoneId);
      const input = document.getElementById(inputId);
      if (!zone || !input) return;
      const fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.hidden = true;
      fileInput.accept = accept;
      zone.appendChild(fileInput);
      const status = zone.querySelector(".dz-status");
      const preview = zone.querySelector(".dz-preview");
      zone.addEventListener("click", () => fileInput.click());
      zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("drag"); });
      zone.addEventListener("dragleave", () => zone.classList.remove("drag"));
      zone.addEventListener("drop", (e) => {
        e.preventDefault();
        zone.classList.remove("drag");
        if (e.dataTransfer.files.length) handle(fileInput, e.dataTransfer.files[0]);
      });
      fileInput.addEventListener("change", () => {
        if (fileInput.files.length) handle(fileInput, fileInput.files[0]);
        fileInput.value = "";
      });

      async function handle(fi, file) {
        const okType = accept.split(",").map(s => s.trim()).some(tok => {
          if (tok.endsWith("/*")) return file.type.startsWith(tok.slice(0, -1));
          return file.type && file.type.startsWith(tok.split("/")[0] + "/");
        });
        if (!okType) {
          status.textContent = t("uploadBadType");
          status.className = "dz-status bad";
          return;
        }
        status.textContent = t("uploading") + " " + file.name;
        status.className = "dz-status";
        try {
          const fd = new FormData();
          fd.append("file", file);
          const res = await fetch("/api/upload", { method: "POST", body: fd });
          const data = await res.json();
          if (!res.ok) throw new Error(translateError(data.error) || "Error");
          input.value = data.url;
          showDropPreview(preview, data.url, file.type);
          status.textContent = "✔ " + t("uploaded") + " " + data.name;
          status.className = "dz-status ok";
        } catch (err) {
          status.textContent = err.message;
          status.className = "dz-status bad";
        }
      }
    }

    function showDropPreview(preview, url, mime) {
      preview.innerHTML = "";
      const img = document.createElement("img");
      if (mime && mime.startsWith("image/")) {
        img.src = url;
        preview.appendChild(img);
      } else if (mime && mime.startsWith("video/")) {
        const v = document.createElement("video");
        v.src = url;
        v.controls = true;
        v.muted = true;
        preview.appendChild(v);
      } else if (mime && mime.startsWith("audio/")) {
        const a = document.createElement("audio");
        a.src = url;
        a.controls = true;
        preview.appendChild(a);
      } else {
        img.src = url;
        img.onerror = () => { preview.innerHTML = "🎬 " + url; };
        preview.appendChild(img);
      }
    }

        { key: "category", label: "categoryField", type: "text" },
        { key: "price", label: "price", type: "number" },
        { key: "in_stock", label: "inStockLabel", type: "checkbox" },
        { key: "video_url", label: "videoUrl", type: "text", placeholder: "YouTube / Vimeo / URL" },
      ],
      icon: false, instructor: false, expert: false,
      sub: it => `${escapeHtml(it.category || "")} · ${fmtPrice(it.price)} · ${it.in_stock ? t("inStock") : t("outOfStock")}`,
    };
    const SECTION_SERVICE = {
      list: "services", type: "service", addTitle: "addService", editTitle: "editService", nameKey: "serviceName", titleCol: "name",
      fields: [
        { key: "price", label: "price", type: "number" },
        { key: "duration_min", label: "duration", type: "number" },
        { key: "icon", label: "iconField", type: "icon" },
      ],
      icon: true, instructor: true, expert: false,
      sub: it => `${it.icon || "💆"} ${it.duration_min} ${t("minUnit")} · ${fmtPrice(it.price)}${it.instructor_name ? " · " + escapeHtml(it.instructor_name) : ""}`,
    };
    const SECTION_CONSULTATION = {
      list: "consultations", type: "consultation", addTitle: "addConsultation", editTitle: "editConsultation", nameKey: "consultationTitle", titleCol: "title",
      fields: [
        { key: "price", label: "price", type: "number" },
        { key: "duration_min", label: "duration", type: "number" },
      ],
      icon: false, instructor: true, expert: true,
      sub: it => `${it.expert ? escapeHtml(it.expert) : "—"} · ${it.duration_min} ${t("minUnit")} · ${fmtPrice(it.price)}`,
    };

    let editingSectionId = null;
    let expandedImagesId = null;

    async function renderSection(panel, cfg) {
      const items = await apiFetch(`/api/admin/${cfg.list}`);
      panel.innerHTML = `
        <div class="panel-title">${t(cfg.list)} (${items.length})</div>
        <div class="admin-form">
          <h4 id="sec-form-title">${t(cfg.addTitle)}</h4>
          <div class="form-group"><label>${t(cfg.nameKey)}</label><input id="sec-name"></div>
          <div class="form-group"><label>${t("description")}</label><textarea id="sec-desc"></textarea></div>
          ${cfg.fields.map(f => sectionFieldHtml(f)).join("")}
          ${cfg.instructor ? `
            <div class="form-group"><label>${t("specialistField")}</label>
              <select id="sec-instr">
                <option value="">${t("noInstructor")}</option>
                ${allInstructors.map(i => `<option value="${i.id}">${escapeHtml(i.name)}</option>`).join("")}
              </select>
              ${allInstructors.length ? "" : `<div class="hint">${t("noInstructorHint")}</div>`}
            </div>` : ""}
          ${cfg.expert ? `<div class="form-group"><label>${t("expertName")}</label><input id="sec-expert" placeholder="${t("expertNameHint")}"></div>` : ""}
          <div class="form-group"><label>${t("imageUrl")}</label><input id="sec-img" placeholder="https://..."></div>
          <div class="drop-zone" id="dz-sec-img">
            <div class="dz-text">🖼 ${t("dragImage")}</div>
            <div class="dz-preview"></div>
            <div class="dz-status"></div>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" id="sec-save">${t("save")}</button>
            <button class="btn btn-outline hidden" id="sec-cancel">✕ ${t("cancel")}</button>
          </div>
        </div>
        ${items.length ? items.map(it => `
          <div class="admin-row">
            <div class="ar-main">
              ${it.image_url ? `<img class="ar-thumb" src="${escapeHtml(it.image_url)}" onerror="this.style.display='none'">` : ""}
              <div>
                <div class="ar-title">${escapeHtml(it[cfg.titleCol])} ${cfg.type === "product" && it.in_stock === 0 ? `<span class="badge badge-out">${t("outOfStock")}</span>` : ""}</div>
                <div class="ar-sub">${cfg.sub(it)}${it.images.length ? ` · ${it.images.length} ${t("imagesCount")}` : ""}</div>
              </div>
            </div>
            <div class="ar-actions">
              <button class="btn btn-outline btn-sm" data-secimg="${it.id}">🎞 ${t("galleryImages")}</button>
              <button class="btn btn-outline btn-sm" data-secedit="${it.id}">✏ ${t("edit")}</button>
              <button class="btn btn-danger btn-sm" data-secdel="${it.id}">${t("delete")}</button>
            </div>
          </div>
          <div class="ig-manager hidden" id="igm-${it.id}"></div>`).join("") : `<div class="empty">—</div>`}
      `;

      if (cfg.instructor) {
        const instrSel = panel.querySelector("#sec-instr");
        instrSel.addEventListener("change", () => {
          if (!cfg.expert) return;
          const selected = allInstructors.find(i => String(i.id) === instrSel.value);
          const expertEl = panel.querySelector("#sec-expert");
          if (selected) expertEl.value = selected.name;
        });
      }
      makeDropZone("dz-sec-img", "sec-img", "image/*");
      if (cfg.icon) sectionEmojiPresets(panel);

      panel.querySelector("#sec-save").addEventListener("click", () => sectionSave(panel, cfg));
      panel.querySelector("#sec-cancel").addEventListener("click", () => { editingSectionId = null; renderSection(panel, cfg); });
      panel.querySelectorAll("[data-secedit]").forEach(btn => {
        btn.addEventListener("click", () => {
          const it = items.find(x => String(x.id) === btn.dataset.secedit);
          if (!it) return;
          editingSectionId = it.id;
          panel.querySelector("#sec-form-title").textContent = t(cfg.editTitle);
          panel.querySelector("#sec-name").value = it[cfg.titleCol] || "";
          panel.querySelector("#sec-desc").value = it.description || "";
          cfg.fields.forEach(f => {
            const el = panel.querySelector(`#sec-${f.key}`);
            if (!el) return;
            if (f.type === "checkbox") el.checked = !!it[f.key];
            else el.value = it[f.key] != null ? it[f.key] : "";
          });
          if (cfg.instructor) panel.querySelector("#sec-instr").value = it.instructor_id || "";
          if (cfg.expert) panel.querySelector("#sec-expert").value = it.expert || "";
          panel.querySelector("#sec-img").value = it.image_url || "";
          showDropPreview(panel.querySelector("#dz-sec-img .dz-preview"), it.image_url || "", "image/*");
          panel.querySelector("#sec-cancel").classList.remove("hidden");
          panel.querySelector(".admin-form").scrollIntoView({ behavior: "smooth", block: "start" });
        });
      });
      panel.querySelectorAll("[data-secdel]").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm(t(cfg.type === "product" ? "confirmDeleteProduct" : cfg.type === "service" ? "confirmDeleteService" : "confirmDeleteConsultation"))) return;
          try {
            await apiFetch(`/api/admin/${cfg.list}/${btn.dataset.secdel}`, { method: "DELETE" });
            renderSection(panel, cfg);
          } catch (err) { alert(err.message); }
        });
      });
      panel.querySelectorAll("[data-secimg]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = Number(btn.dataset.secimg);
          const manager = panel.querySelector(`#igm-${id}`);
          if (!manager.classList.contains("hidden")) {
            manager.classList.add("hidden");
            manager.innerHTML = "";
            if (expandedImagesId === id) expandedImagesId = null;
            return;
          }
          expandedImagesId = id;
          const it = items.find(x => x.id === id);
          renderImagesManager(panel, cfg, manager, it);
        });
      });

      if (expandedImagesId) {
        const m = panel.querySelector(`#igm-${expandedImagesId}`);
        const it = items.find(x => x.id === expandedImagesId);
        if (m && it) renderImagesManager(panel, cfg, m, it);
      }
    }

    function sectionFieldHtml(f) {
      if (f.type === "checkbox") {
        return `<div class="form-group"><label class="check-label"><input type="checkbox" id="sec-${f.key}"> ${t(f.label)}</label></div>`;
      }
      if (f.type === "icon") {
        return `<div class="form-group"><label>${t(f.label)}</label>
          <input id="sec-icon" maxlength="4">
          <div class="emoji-presets">${"💆🦴🏋️🧘👶🌊💧🔥🩺💊".split("").map(e => `<button type="button" class="btn btn-outline" data-emoji="${e}">${e}</button>`).join("")}</div>
        </div>`;
      }
      return `<div class="form-group"><label>${t(f.label)}</label><input type="${f.type === "number" ? "number" : "text"}" id="sec-${f.key}" min="0"${f.placeholder ? ` placeholder="${f.placeholder}"` : ""}></div>`;
    }

    function sectionEmojiPresets(panel) {
      panel.querySelectorAll("[data-emoji]").forEach(b => {
        b.addEventListener("click", () => { panel.querySelector("#sec-icon").value = b.dataset.emoji; });
      });
    }

    async function sectionSave(panel, cfg) {
      const payload = {
        name: panel.querySelector("#sec-name").value.trim(),
        title: panel.querySelector("#sec-name").value.trim(),
        description: panel.querySelector("#sec-desc").value.trim(),
        price: panel.querySelector("#sec-price").value || 0,
        image_url: panel.querySelector("#sec-img").value.trim(),
      };
      if (panel.querySelector("#sec-category")) payload.category = panel.querySelector("#sec-category").value.trim();
      if (panel.querySelector("#sec-in_stock")) payload.in_stock = panel.querySelector("#sec-in_stock").checked ? 1 : 0;
      if (panel.querySelector("#sec-video_url")) payload.video_url = panel.querySelector("#sec-video_url").value.trim();
      if (panel.querySelector("#sec-duration_min")) payload.duration_min = panel.querySelector("#sec-duration_min").value || 0;
      if (panel.querySelector("#sec-icon")) payload.icon = panel.querySelector("#sec-icon").value.trim();
      if (panel.querySelector("#sec-instr")) payload.instructor_id = panel.querySelector("#sec-instr").value ? Number(panel.querySelector("#sec-instr").value) : null;
      if (panel.querySelector("#sec-expert")) payload.expert = panel.querySelector("#sec-expert").value.trim();
      try {
        if (editingSectionId) {
          await apiFetch(`/api/admin/${cfg.list}/${editingSectionId}`, {
            method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
          });
        } else {
          await apiFetch(`/api/admin/${cfg.list}`, {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
          });
        }
        editingSectionId = null;
        await renderSection(panel, cfg);
      } catch (err) { alert(err.message); }
    }

    function renderImagesManager(panel, cfg, manager, item) {
      manager.classList.remove("hidden");
      manager.innerHTML = `
        <div class="ig-grid">
          ${item.images.map(im => `
            <div class="ig-card">
              <img src="${escapeHtml(im.url)}" onerror="this.closest('.ig-card').style.display='none'">
              <button class="btn btn-danger" data-imgdel="${im.id}" title="${t("delete")}">✕</button>
            </div>`).join("") || `<div class="empty">—</div>`}
        </div>
        <div class="ig-add">
          <input id="igm-url" placeholder="https://...">
          <button class="btn" data-imgadd>➕ ${t("addImage")}</button>
          <div class="drop-zone ig-drop" id="igm-drop">
            <div class="dz-text">🖼 ${t("imagesHint")}</div>
            <div class="dz-status"></div>
          </div>
        </div>`;
      const refresh = async () => { expandedImagesId = item.id; await renderSection(panel, cfg); };
      const addImage = async (url) => {
        if (!url) return;
        try {
          await apiFetch(`/api/admin/${cfg.list}/${item.id}/images`, {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url }),
          });
          refresh();
        } catch (err) { alert(err.message); }
      };
      manager.querySelector("[data-imgadd]").addEventListener("click", () => addImage(manager.querySelector("#igm-url").value.trim()));
      manager.querySelectorAll("[data-imgdel]").forEach(b => {
        b.addEventListener("click", async () => {
          if (!confirm(t("confirmDeleteImage"))) return;
          try {
            await apiFetch(`/api/admin/item-images/${b.dataset.imgdel}`, { method: "DELETE" });
            refresh();
          } catch (err) { alert(err.message); }
        });
      });
      galleryDropZone("igm-drop", addImage);
    }

    function galleryDropZone(zoneId, onUrl) {
      const zone = document.getElementById(zoneId);
      if (!zone) return;
      const fi = document.createElement("input");
      fi.type = "file";
      fi.hidden = true;
      fi.accept = "image/*";
      zone.appendChild(fi);
      const status = zone.querySelector(".dz-status");
      zone.addEventListener("click", () => fi.click());
      zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("drag"); });
      zone.addEventListener("dragleave", () => zone.classList.remove("drag"));
      zone.addEventListener("drop", e => {
        e.preventDefault();
        zone.classList.remove("drag");
        if (e.dataTransfer.files.length) up(e.dataTransfer.files[0]);
      });
      fi.addEventListener("change", () => {
        if (fi.files.length) up(fi.files[0]);
        fi.value = "";
      });
      async function up(file) {
        if (!file.type.startsWith("image/")) {
          status.textContent = t("uploadBadType");
          status.className = "dz-status bad";
          return;
        }
        status.textContent = t("uploading") + " " + file.name;
        status.className = "dz-status";
        try {
          const fd = new FormData();
          fd.append("file", file);
          const res = await fetch("/api/upload", { method: "POST", body: fd });
          const data = await res.json();
          if (!res.ok) throw new Error(translateError(data.error) || "Error");
          status.textContent = "✔ " + t("uploaded");
          status.className = "dz-status ok";
          onUrl(data.url);
        } catch (err) {
          status.textContent = err.message;
          status.className = "dz-status bad";
        }
      }
    }

    // ============ ОТЗЫВЫ САЙТА ============
    // ============ ЗАЯВКИ ============
    function renderRequests(panel, requests) {
      panel.innerHTML = `
        <div class="panel-title">${t("requests")} (${requests.length})</div>
        ${requests.length ? requests.map(r => `
          <div class="admin-row">
            <div class="ar-main">
              <div>
                <div class="ar-title">${escapeHtml(r.name || "—")} · <a href="tel:${escapeHtml(r.phone || "")}">${escapeHtml(r.phone || "")}</a></div>
                <div class="ar-sub">${escapeHtml(r.subject || "")} · ${new Date(r.created_at).toLocaleString()}</div>
              </div>
            </div>
            <div class="ar-actions"><button class="btn btn-danger btn-sm" data-reqdel="${r.id}">${t("delete")}</button></div>
          </div>`).join("") : `<div class="empty">${t("requestsEmpty")}</div>`}
      `;
      panel.querySelectorAll("[data-reqdel]").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm(t("confirmDeleteRequest"))) return;
          try {
            await apiFetch(`/api/admin/requests/${btn.dataset.reqdel}`, { method: "DELETE" });
            loadPanel();
          } catch (err) { alert(err.message); }
        });
      });
    }

    function openMessageModal(userId, name) {
      const overlay = document.createElement("div");
      overlay.className = "modal-overlay";
      overlay.innerHTML = `
        <div class="modal">
          <h3>✉ ${t("sendMessage")} ${escapeHtml(name || "")}</h3>
          <div class="form-group"><label>${t("messages")}</label><textarea id="msg-text" rows="5" placeholder="${t("sendMessage")}..."></textarea></div>
          <div class="form-actions">
            <button class="btn btn-primary" id="msg-send">${t("send")}</button>
            <button class="btn btn-outline" id="msg-close">${t("close")}</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      const close = () => overlay.remove();
      overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
      overlay.querySelector("#msg-close").addEventListener("click", close);
      overlay.querySelector("#msg-send").addEventListener("click", async () => {
        const text = overlay.querySelector("#msg-text").value.trim();
        if (!text) return alert(t("enterMessage"));
        try {
          await apiFetch("/api/messages", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ to_user_id: Number(userId), text }),
          });
          alert(t("messageSent"));
          close();
        } catch (err) { alert(err.message); }
      });
    }

    initTheme();
    renderNav();
    loadPanel();
  </script>
</body>
</html>
