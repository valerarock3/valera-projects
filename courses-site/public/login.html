<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">MAGIC🌞SUN ELLEN</a>
    <div class="nav-links" id="nav-links"></div>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </nav>

  <div class="container">
    <div class="card form-card">
      <h2 class="page-title" data-i18n="login">Вход</h2>
      <div class="form-error" id="form-error"></div>
      <div class="form-group">
        <label data-i18n="email">Email</label>
        <input type="email" id="email" data-i18n-ph="emailPh" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label data-i18n="password">Пароль</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" id="login-btn" data-i18n="loginBtn">Войти</button>
      <button class="btn btn-outline btn-sm demo-login" id="demo-login" data-i18n="demoHint">Демо-доступ: user@courses.ru / user123</button>
      <div class="form-hint"><a href="forgot-password.html" data-i18n="forgotPass">Забыли пароль?</a></div>
      <div class="form-hint" data-i18n="noAccount">Нет аккаунта? <a href="register.html" id="reg-link" data-i18n="registration">Зарегистрироваться</a></div>
    </div>
  </div>

  <script src="translations.js"></script>
  <script src="common.js"></script>
  <script>
    const next = new URLSearchParams(location.search).get("next") || "";
    if (next) document.getElementById("reg-link").href = "register.html?next=" + encodeURIComponent(next);

    document.getElementById("login-btn").addEventListener("click", async (e) => {
      const btn = e.target;
      btn.disabled = true;
      const body = {
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      };
      try {
        const data = await apiFetch("/api/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        window.location.href = data.user.role === "admin" ? "admin.html" : (next || "profile.html");
      } catch (err) { showError(btn, err.message); }
    });

    document.getElementById("password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("login-btn").click();
    });

    document.getElementById("demo-login").addEventListener("click", () => {
      document.getElementById("email").value = "user@courses.ru";
      document.getElementById("password").value = "user123";
      document.getElementById("login-btn").click();
    });

    initTheme();
    applyI18n();
  </script>
</body>
</html>
