<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">🎓 Курсы</a>
    <div class="nav-links" id="nav-links"></div>
  </nav>

  <div class="container">
    <div class="card form-card">
      <h2 class="page-title" data-i18n="login">Вход</h2>
      <div class="form-error" id="form-error"></div>
      <div class="form-group">
        <label data-i18n="email">Email</label>
        <input type="email" id="email" data-i18n-ph="emailPh" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label data-i18n="password">Пароль</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" id="login-btn" data-i18n="loginBtn">Войти</button>
      <div class="form-hint" data-i18n="noAccount">Нет аккаунта? <a href="register.html" data-i18n="registration">Зарегистрироваться</a></div>
    </div>
  </div>

  <script src="translations.js"></script>
  <script src="common.js"></script>
  <script>
    document.getElementById("login-btn").addEventListener("click", async (e) => {
      const btn = e.target;
      btn.disabled = true;
      const body = {
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      };
      try {
        const data = await apiFetch("/api/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        window.location.href = data.user.role === "admin" ? "admin.html" : "index.html";
      } catch (err) { showError(btn, err.message); }
    });

    document.getElementById("password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("login-btn").click();
    });

    initTheme();
    applyI18n();
  </script>
</body>
</html>
