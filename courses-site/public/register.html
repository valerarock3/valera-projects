<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">MAGIC🌞SUN ELLEN</a>
    <div class="nav-links" id="nav-links"></div>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </nav>

  <div class="container">
    <div class="card form-card">
      <h2 class="page-title" data-i18n="registration">Регистрация</h2>
      <div class="form-error" id="form-error"></div>
      <div class="form-group">
        <label data-i18n="name">Имя</label>
        <input type="text" id="name" data-i18n-ph="enterName" placeholder="Ваше имя">
      </div>
      <div class="form-group">
        <label data-i18n="email">Email</label>
        <input type="email" id="email" data-i18n-ph="emailPh" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label data-i18n="password">Пароль (минимум 6 символов)</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" id="register-btn" data-i18n="registerBtn">Зарегистрироваться</button>
      <div class="form-hint" data-i18n="haveAccount">Уже есть аккаунт? <a href="login.html" id="login-link" data-i18n="login">Войти</a></div>
    </div>
  </div>

  <script src="translations.js"></script>
  <script src="common.js"></script>
  <script>
    const next = new URLSearchParams(location.search).get("next") || "";
    if (next) document.getElementById("login-link").href = "login.html?next=" + encodeURIComponent(next);

    document.getElementById("register-btn").addEventListener("click", async (e) => {
      const btn = e.target;
      btn.disabled = true;
      const body = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      };
      try {
        const data = await apiFetch("/api/register", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        window.location.href = next || "index.html";
      } catch (err) { showError(btn, err.message); }
    });

    initTheme();
    applyI18n();
  </script>
</body>
</html>
