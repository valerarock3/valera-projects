<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Запись</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">🎓 Курсы</a>
    <div class="nav-links" id="nav-links"></div>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </nav>

  <div class="container" id="item-container"><div class="loading">Загрузка...</div></div>

  <script src="translations.js"></script>
  <script src="common.js"></script>
  <script>
    const type = new URLSearchParams(location.search).get("type");
    const id = new URLSearchParams(location.search).get("id");
    let me = null;

    const CFG = {
      product: { list: "products.html", titleKey: "products" },
      service: { list: "services.html", titleKey: "services" },
      consultation: { list: "consultation.html", titleKey: "consultation" },
    };
    const cfg = CFG[type] || null;

    function starsHtml(rating) {
      const r = Math.min(5, Math.max(0, Number(rating) || 0));
      return "★".repeat(r) + "☆".repeat(5 - r);
    }

    function instructorCardHtml(item) {
      if (!item.instructor_info) return "";
      const a = item.instructor_info;
      return `
        <div class="author-card card">
          <img src="${escapeHtml(a.avatar || "/uploads/svetlana.svg")}" alt="">
          <div>
            <div class="ac-label">${t("specialist")}</div>
            <div class="ac-name"><a class="author-link" href="author.html?id=${a.id}">${escapeHtml(a.name)}</a></div>
            ${a.specialty ? `<div class="ac-spec">${escapeHtml(a.specialty)}</div>` : ""}
            <a class="btn btn-outline btn-sm" href="author.html?id=${a.id}" style="margin-top:8px">${t("viewProfile")} →</a>
          </div>
        </div>`;
    }

    function galleryHtml(item) {
      const images = item.images && item.images.length ? item.images : ["/uploads/course-default.svg"];
      const main = images[0];
      const thumbs = images.slice(1);
      let videoHtml = "";
      if (item.video_url) {
        const url = item.video_url;
        const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]+)/);
        const vimeo = url.match(/vimeo\.com\/(\d+)/);
        const gdrive = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]+)/);
        if (yt) {
          videoHtml = `<div class="item-video" style="margin-bottom:16px"><iframe width="100%" height="380" src="https://www.youtube.com/embed/${yt[1]}" frameborder="0" allowfullscreen></iframe></div>`;
        } else if (vimeo) {
          videoHtml = `<div class="item-video" style="margin-bottom:16px"><iframe width="100%" height="380" src="https://player.vimeo.com/video/${vimeo[1]}" frameborder="0" allowfullscreen></iframe></div>`;
        } else if (gdrive) {
          videoHtml = `<div class="item-video" style="margin-bottom:16px"><video controls style="width:100%;border-radius:10px" src="https://drive.google.com/uc?export=download&id=${gdrive[1]}"></video></div>`;
        } else {
          videoHtml = `<div class="item-video" style="margin-bottom:16px"><video controls style="width:100%;border-radius:10px" src="${escapeHtml(url)}"></video></div>`;
        }
      }
      return `
        ${videoHtml}
        <div class="item-gallery">
          <div class="ig-main"><img src="${escapeHtml(main)}" alt="" id="ig-main"></div>
          ${thumbs.length ? `<div class="ig-thumbs">${thumbs.map((u, i) => `
            <img class="ig-thumb${i === 0 ? " active" : ""}" src="${escapeHtml(u)}" alt="" onclick="setMain(this)">`).join("")}
          </div>` : ""}
        </div>`;
    }

    function metaHtml(item) {
      const parts = [];
      if (item.duration_min) parts.push(`<span>⏱ ${item.duration_min} ${t("minLabel")}</span>`);
      if (type === "product") {
        parts.push(`<span class="badge-stock ${item.in_stock ? "in" : "out"}">${item.in_stock ? t("inStock") : t("outOfStock")}</span>`);
      }
      return parts.length ? `<div class="item-meta">${parts.join("")}</div>` : "";
    }

    function ctaHtml(item) {
      if (type === "product") {
        return `<button class="btn btn-primary" style="width:100%" onclick="openContactModal()">${t("writeDirectly")}</button>`;
      }
      return `<button class="btn btn-primary" style="width:100%" onclick="openContactModal()">${t("writeDirectly")}</button>`;
    }

    async function loadItem() {
      const container = document.getElementById("item-container");
      if (!cfg) { container.innerHTML = `<div class="empty">${t("itemNotFound")}</div>`; return; }
      try {
        me = await fetchMe();
        const item = await apiFetch(`/api/items/${type}/${id}`);
        const title = item.name || item.title || "";
        const cat = type === "product" ? item.category : (item.expert || "");
        container.innerHTML = `
          ${breadcrumbs([
            { text: t("home"), href: "index.html" },
            { text: t(cfg.titleKey), href: cfg.list },
            { text: title },
          ])}
          <div class="course-detail-grid mt-16">
            <div class="course-hero">
              ${galleryHtml(item)}
              ${cat ? `<div class="cat">${escapeHtml(cat)}</div>` : ""}
              <h1>${escapeHtml(title)}</h1>
              ${metaHtml(item)}
              <div class="desc">${escapeHtml(item.description || "")}</div>
              ${instructorCardHtml(item)}
            </div>
            <div class="enroll-card card item-info-card">
              <div class="price">${fmtPrice(item.price)}</div>
              ${ctaHtml(item)}
            </div>
          </div>`;
        container.querySelectorAll("[data-cta]").forEach(a => {
          a.addEventListener("click", (e) => {
            if (me) return;
            e.preventDefault();
            location.href = "login.html?next=" + encodeURIComponent("item.html?type=" + type + "&id=" + id);
          });
        });
      } catch (err) {
        container.innerHTML = `<div class="empty">${escapeHtml(err.message)}</div>`;
      }
    }

    function setMain(el) {
      const main = document.getElementById("ig-main");
      if (main) main.src = el.src;
      document.querySelectorAll(".ig-thumb").forEach(t => t.classList.toggle("active", t === el));
    }

    loadItem();
  </script>
</body>
</html>
