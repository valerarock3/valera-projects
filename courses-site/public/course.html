<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Курс</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">MAGIC🌞SUN ELLEN</a>
    <div class="nav-links" id="nav-links"></div>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </nav>

  <div class="container" id="course-container"><div class="loading">Загрузка курса...</div></div>

  <script src="translations.js"></script>
  <script src="common.js"></script>
  <script>
    const courseId = new URLSearchParams(location.search).get("id");
    let me = null;
    let course = null;

    async function loadCourse() {
      const container = document.getElementById("course-container");
      try {
        me = await fetchMe();
        course = await apiFetch(`/api/courses/${courseId}`);
      } catch (err) {
        container.innerHTML = `<div class="empty">${err.message}</div>`;
        return;
      }
      renderCourse();
    }

    function renderCourse() {
      const container = document.getElementById("course-container");
      const canAccess = !!course.enrolled || !!course.isAdmin;

      container.innerHTML = `
        ${breadcrumbs([
          { text: t("home"), href: "index.html" },
          { text: t("sectionCourses"), href: "catalog.html" },
          { text: course.title },
        ])}
        <div class="course-detail-grid mt-16">
          <div class="course-hero">
            ${heroMediaHtml(course)}
            <div class="cat">${escapeHtml(course.category_name) || t("noCategory")}</div>
            <h1>${escapeHtml(course.title)}</h1>
            <div class="desc">${escapeHtml(course.description || "")}</div>
            <div class="instructor">👁 ${Number(course.views) || 0} ${pluralViews(course.views)}</div>

            <div class="lesson-list">
              <h3 class="page-title" style="font-size:20px">${t("lessons")} (${course.lessons.length})</h3>
              ${course.lessons.map(l => {
                const open = canAccess;
                return `
                <div class="lesson-item ${open ? "" : "locked"}" data-lesson="${l.id}" data-open="${open ? "1" : "0"}">
                  <div>
                    <div class="lesson-title">${l.position + 1}. ${escapeHtml(l.title)}</div>
                    <div class="lesson-dur">⏱ ${l.duration_min} ${t("min")}</div>
                  </div>
                  <span class="lesson-status">${open ? "▶" : "🔒"}</span>
                </div>`;
              }).join("")}
              ${canAccess ? "" : `<div class="empty" id="lessons-locked">${t("lessonsLocked")}</div>`}
            </div>

            <div id="lesson-view"></div>


          </div>

          <div class="enroll-card card">
            <div class="price">${fmtPrice(course.price)}</div>
            ${canAccess
              ? `<div style="text-align:center;color:var(--success);font-weight:600;margin-bottom:12px">${t("enrolled")}</div>
                 ${course.progress >= 100 ? `<a class="btn btn-primary" style="width:100%;margin-bottom:12px" href="/api/certificate/${courseId}">${t("certificate")}</a>` : ""}`
              : `<button class="btn btn-primary" id="write-btn" data-i18n="writeDirectly">Написать</button>`}
            <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);font-size:13px;color:var(--text-faint)">
              📊 ${course.lessons.length} ${pluralLessons(course.lessons.length)}<br>🗂 ${escapeHtml(course.category_name) || t("noCategory")}
            </div>
          </div>
        </div>
      `;
      applyI18n();
      setupGallery();

      document.getElementById("write-btn")?.addEventListener("click", () => openContactModal());

      document.querySelectorAll(".lesson-item").forEach(item => {
        item.addEventListener("click", () => {
          if (item.dataset.open !== "1") {
            if (!me) { window.location.href = "login.html"; return; }
            alert(t("demoLocked"));
            return;
          }
          showLesson(Number(item.dataset.lesson));
        });
      });


    }

    async function showLesson(lessonId) {
      const lesson = course.lessons.find(l => l.id === lessonId);
      if (!lesson) return;
      const view = document.getElementById("lesson-view");
      const fullAccess = !!course.enrolled || !!course.isAdmin;
      view.innerHTML = `
        <div class="lesson-view">
          <h3>${lesson.position + 1}. ${escapeHtml(lesson.title)}</h3>
          ${lesson.image_url ? `<img class="lesson-img" src="${escapeHtml(lesson.image_url)}" alt="">` : ""}
          ${lesson.video_url ? renderMedia(lesson.video_url) : ""}
          <div class="lesson-text">${nl2br(lesson.content)}</div>
          <div class="lesson-actions">
            ${!fullAccess ? `<button class="btn btn-primary" id="full-access-btn">${t("fullAccess")}</button>` : ""}
          </div>
          <div class="lesson-protect-note">🔒 ${t("lessonProtectNote")}</div>
          <div class="lesson-watermark" aria-hidden="true">${escapeHtml(me ? me.name : "")} · ${escapeHtml(course.title)}</div>
        </div>`;
      view.scrollIntoView({ behavior: "smooth", block: "start" });
      wireSpeed(view);
      protectLesson(view);
      const fullAccessBtn = document.getElementById("full-access-btn");
      if (fullAccessBtn) fullAccessBtn.addEventListener("click", () => {
        if (!me) { window.location.href = "login.html"; return; }
        document.getElementById("write-btn")?.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    }

    function heroMediaHtml(c) {
      const media = (c.media || []).filter(m => m.type !== "audio");
      if (media.length > 0) {
        const slides = media.map(m => `
          <div class="mg-slide">
            ${m.type === "video"
              ? `<div class="media-wrap">${renderMedia(m.url)}</div>`
              : `<img src="${escapeHtml(m.url)}" alt="">`}
          </div>`).join("");
        return `
          <div class="media-gallery" id="media-gallery" data-count="${media.length}">
            <div class="mg-track">${slides}</div>
            <button class="mg-nav mg-prev" aria-label="${t("prev")}">‹</button>
            <button class="mg-nav mg-next" aria-label="${t("next")}">›</button>
            <div class="mg-dots">${media.map((_, i) => `<span class="mg-dot${i === 0 ? " active" : ""}" data-i="${i}"></span>`).join("")}</div>
            <div class="mg-count"><span class="mg-cur">1</span>/${media.length}</div>
          </div>`;
      }
      return `<img class="course-cover" src="${courseCover(c)}" alt="">`;
    }

    function setupGallery() {
      const gallery = document.getElementById("media-gallery");
      if (!gallery) return;
      const slides = gallery.querySelectorAll(".mg-slide");
      const dots = gallery.querySelectorAll(".mg-dot");
      const countEl = gallery.querySelector(".mg-cur");
      const total = slides.length;
      let index = 0;

      const show = (i) => {
        index = (i + total) % total;
        slides.forEach((s, j) => s.classList.toggle("active", j === index));
        dots.forEach((d, j) => d.classList.toggle("active", j === index));
        if (countEl) countEl.textContent = index + 1;
      };

      gallery.querySelector(".mg-prev").addEventListener("click", () => show(index - 1));
      gallery.querySelector(".mg-next").addEventListener("click", () => show(index + 1));
      dots.forEach(d => d.addEventListener("click", () => show(Number(d.dataset.i))));
      wireSpeed(gallery);

      if (window.__galleryKeyHandler) document.removeEventListener("keydown", window.__galleryKeyHandler);
      window.__galleryKeyHandler = (e) => {
        if (gallery.matches(":hover") && e.key === "ArrowLeft") show(index - 1);
        if (gallery.matches(":hover") && e.key === "ArrowRight") show(index + 1);
      };
      document.addEventListener("keydown", window.__galleryKeyHandler);

      let touchX = null;
      gallery.addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
      gallery.addEventListener("touchend", (e) => {
        if (touchX === null) return;
        const dx = e.changedTouches[0].clientX - touchX;
        if (dx > 40) show(index - 1);
        else if (dx < -40) show(index + 1);
        touchX = null;
      }, { passive: true });

      if (total <= 1) {
        gallery.querySelectorAll(".mg-nav, .mg-dots").forEach(el => el.style.display = "none");
      }
    }

    function speedRow() {
      return `<div class="speed-row" role="group" aria-label="${t("speedLabel")}">
        ${[0.75, 1, 1.25, 1.5, 2].map(r => `<button type="button" data-rate="${r}" class="${r === 1 ? "active" : ""}">${r}×</button>`).join("")}
      </div>`;
    }

    function protectLesson(root) {
      if (!root) return;
      root.querySelectorAll("video, audio").forEach(m => {
        m.setAttribute("controlsList", "nodownload noremoteplayback");
        m.setAttribute("disablepictureinpicture", "");
        m.oncontextmenu = () => false;
      });
      if (root.dataset.protected) return;
      root.dataset.protected = "1";
      const blocked = e => e.preventDefault();
      root.addEventListener("contextmenu", blocked);
      root.addEventListener("copy", blocked);
      root.addEventListener("cut", blocked);
      root.addEventListener("paste", blocked);
      root.addEventListener("dragstart", blocked);
      root.addEventListener("keydown", e => {
        if (e.ctrlKey && ["c", "x", "s", "p", "u", "a"].includes((e.key || "").toLowerCase())) e.preventDefault();
        if (e.key === "F12") e.preventDefault();
        if (e.ctrlKey && e.shiftKey && ["i", "j", "c", "k"].includes((e.key || "").toLowerCase())) e.preventDefault();
      });
      root.addEventListener("mousedown", e => {
        if (e.button === 2) e.preventDefault();
      });
    }

    function renderVideo(url) {
      let src = url.trim();
      const yt = src.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]+)/);
      if (yt) {
        return `<div class="video-embed"><iframe src="https://www.youtube.com/embed/${yt[1]}" frameborder="0" allowfullscreen allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture"></iframe></div>`;
      }
      const gdrive = src.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]+)/);
      if (gdrive) {
        return `<div class="media-wrap">${speedRow()}<video class="video-wrap" controls controlsList="nodownload" disablepictureinpicture oncontextmenu="return false" preload="metadata"><source src="/api/proxy/gdrive?id=${gdrive[1]}"></video></div>`;
      }
      const ydisk = src.match(/((?:https?:\/\/)?(?:yadi\.sk|disk\.yandex\.\w+)\/[di]\/[\w-]+)/);
      if (ydisk) {
        const ydiskUrl = ydisk[1].startsWith("http") ? ydisk[1] : "https://" + ydisk[1];
        return `<div class="media-wrap">${speedRow()}<video class="video-wrap" controls controlsList="nodownload" disablepictureinpicture oncontextmenu="return false" preload="metadata"><source src="/api/proxy/ydisk?url=${encodeURIComponent(ydiskUrl)}"></video></div>`;
      }
      const vimeo = src.match(/vimeo\.com\/(\d+)/);
      if (vimeo) {
        return `<div class="video-embed"><iframe src="https://player.vimeo.com/video/${vimeo[1]}" frameborder="0" allowfullscreen allow="autoplay;encrypted-media"></iframe></div>`;
      }
      return `<div class="media-wrap">${speedRow()}<video class="video-wrap" controls controlsList="nodownload" disablepictureinpicture oncontextmenu="return false" preload="metadata"><source src="${escapeHtml(src)}"></video></div>`;
    }

    function renderMedia(url) {
      let src = url.trim();
      if (/\.(mp3|wav|m4a|aac|ogg|oga)$/i.test(src)) {
        return `<div class="media-wrap">${speedRow()}<audio class="audio-wrap" controls controlsList="nodownload" disablepictureinpicture oncontextmenu="return false" preload="metadata" src="${escapeHtml(src)}"></audio></div>`;
      }
      return renderVideo(src);
    }

    function wireSpeed(scope) {
      (scope || document).querySelectorAll(".media-wrap").forEach(wrap => {
        const media = wrap.querySelector("video, audio");
        if (!media) return;
        wrap.querySelectorAll(".speed-row button").forEach(btn => {
          btn.addEventListener("click", () => {
            try { media.playbackRate = Number(btn.dataset.rate); } catch (_) {}
            wrap.querySelectorAll(".speed-row button").forEach(b => b.classList.toggle("active", b === btn));
          });
        });
      });
    }

    initTheme();
    renderNav();
    loadCourse();
  </script>
</body>
</html>
