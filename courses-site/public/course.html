<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Курс</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">🎓 Курсы</a>
    <div class="nav-links" id="nav-links"></div>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </nav>

  <div class="container" id="course-container"><div class="loading">Загрузка курса...</div></div>

  <div class="modal-overlay hidden" id="pay-modal">
    <div class="modal">
      <h3 data-i18n="payTitle">Оплата курса</h3>
      <div id="pay-body"></div>
    </div>
  </div>

  <script src="translations.js"></script>
  <script src="common.js"></script>
  <script>
    const courseId = new URLSearchParams(location.search).get("id");
    let me = null;
    let course = null;

    async function loadCourse() {
      const container = document.getElementById("course-container");
      try {
        me = await fetchMe();
        course = await apiFetch(`/api/courses/${courseId}`);
      } catch (err) {
        container.innerHTML = `<div class="empty">${err.message}</div>`;
        return;
      }
      renderCourse();
    }

    function renderCourse() {
      const container = document.getElementById("course-container");
      const canAccess = !!course.enrolled || !!course.isAdmin;
      const avg = course.reviews.length
        ? (course.reviews.reduce((s, r) => s + r.rating, 0) / course.reviews.length).toFixed(1)
        : "—";

      container.innerHTML = `
        ${breadcrumbs([
          { text: t("home"), href: "index.html" },
          { text: t("sectionCourses"), href: "catalog.html" },
          { text: course.title },
        ])}
        <div class="course-detail-grid mt-16">
          <div class="course-hero">
            ${heroMediaHtml(course)}
            <div class="cat">${escapeHtml(course.category_name) || t("noCategory")}</div>
            <h1>${escapeHtml(course.title)}</h1>
            <div class="desc">${escapeHtml(course.description || "")}</div>
            <div class="instructor">${t("instructor")}: ${instructorLinkHtml()} · ⭐ ${t("rating")}: ${avg} (${course.reviews.length}) · 👁 ${Number(course.views) || 0} ${pluralViews(course.views)}</div>
            ${authorCardHtml()}

            <div class="lesson-list">
              <h3 class="page-title" style="font-size:20px">${t("lessons")} (${course.lessons.length})</h3>
              ${course.lessons.map(l => {
                const open = canAccess;
                return `
                <div class="lesson-item ${open ? "" : "locked"}" data-lesson="${l.id}" data-open="${open ? "1" : "0"}">
                  <div>
                    <div class="lesson-title">${l.position + 1}. ${escapeHtml(l.title)}</div>
                    <div class="lesson-dur">⏱ ${l.duration_min} ${t("min")}</div>
                  </div>
                  <span class="lesson-status">${open ? "▶" : "🔒"}</span>
                </div>`;
              }).join("")}
              ${canAccess ? "" : `<div class="empty" id="lessons-locked">${t("lessonsLocked")}</div>`}
            </div>

            <div id="lesson-view"></div>

            <div class="reviews">
              <h3 class="page-title" style="font-size:20px">${t("reviews")} (${course.reviews.length})</h3>
              ${canAccess ? `
                <div class="card mt-16">
                  <h4 style="margin-bottom:12px">${t("leaveReview")}</h4>
                  <div class="form-group">
                    <label data-i18n="ratingLabel">Оценка</label>
                    <select id="review-rating">
                      <option value="5" data-i18n="rating5">5 — отлично</option>
                      <option value="4" data-i18n="rating4">4 — хорошо</option>
                      <option value="3" data-i18n="rating3">3 — нормально</option>
                      <option value="2" data-i18n="rating2">2 — плохо</option>
                      <option value="1" data-i18n="rating1">1 — ужасно</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label data-i18n="commentLabel">Комментарий</label>
                    <textarea id="review-comment" data-i18n-ph="commentPh" placeholder="Поделитесь впечатлением о курсе..."></textarea>
                  </div>
                  <button class="btn btn-primary" id="review-btn" data-i18n="sendReview">Отправить отзыв</button>
                </div>` : ""}
              ${course.reviews.map(r => `
                <div class="review-item">
                  <span class="stars">${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</span>
                  <span class="ruser"> ${escapeHtml(r.name)}</span>
                  <div class="rtext">${nl2br(r.comment || "")}</div>
                </div>`).join("") || `<div class="empty">${t("noReviews")}</div>`}
            </div>
          </div>

          <div class="enroll-card card">
            <div class="price">${fmtPrice(course.price)}</div>
            ${course.enrolled
              ? `<div style="text-align:center;color:var(--success);font-weight:600;margin-bottom:12px">${t("enrolled")}<br><span style="font-size:13px;color:var(--text-faint)">${t("progress")}: ${course.progress}%</span></div>
                 ${course.progress >= 100 ? `<a class="btn btn-primary" style="width:100%;margin-bottom:12px" href="/api/certificate/${courseId}">${t("certificate")}</a>` : ""}`
              : `<button class="btn btn-primary" id="enroll-btn" data-i18n="enrollBtn">Записаться на курс</button>
                 <button class="btn btn-outline" id="no-account-btn" data-i18n="createAccount">Создать аккаунт</button>`}
            <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);font-size:13px;color:var(--text-faint)">
              📊 ${course.lessons.length} ${pluralLessons(course.lessons.length)}<br>${t("instructor")}: ${instructorLinkHtml()}<br>🗂 ${escapeHtml(course.category_name) || t("noCategory")}
            </div>
          </div>
        </div>
      `;
      applyI18n();
      setupGallery();

      document.getElementById("enroll-btn")?.addEventListener("click", startEnroll);
      document.getElementById("no-account-btn")?.addEventListener("click", () => location.href = "register.html");

      document.querySelectorAll(".lesson-item").forEach(item => {
        item.addEventListener("click", () => {
          if (item.dataset.open !== "1") {
            if (!me) { window.location.href = "login.html"; return; }
            alert(t("demoLocked"));
            document.getElementById("enroll-btn")?.scrollIntoView({ behavior: "smooth", block: "center" });
            return;
          }
          showLesson(Number(item.dataset.lesson));
        });
      });

      document.getElementById("review-btn")?.addEventListener("click", async () => {
        await apiFetch(`/api/courses/${courseId}/review`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            rating: document.getElementById("review-rating").value,
            comment: document.getElementById("review-comment").value,
          }),
        });
        loadCourse();
      });
    }

    function instructorLinkHtml() {
      const info = course.instructor_info;
      if (!info || !info.id) return escapeHtml(course.instructor) || "—";
      return `<a class="author-link" href="author.html?id=${info.id}">${escapeHtml(info.name)}</a>`;
    }

    function authorCardHtml() {
      const info = course.instructor_info;
      if (!info || !info.id) return "";
      return `
        <div class="author-card card">
          <img src="${escapeHtml(info.avatar || "/uploads/course-default.svg")}" alt="">
          <div class="ac-body">
            <div class="ac-label">${t("aboutAuthor")}</div>
            <div class="ac-name"><a class="author-link" href="author.html?id=${info.id}">${escapeHtml(info.name)}</a></div>
            ${info.specialty ? `<div class="ac-spec">${escapeHtml(info.specialty)}</div>` : ""}
            <a class="btn btn-outline btn-sm" href="author.html?id=${info.id}">${t("viewAuthorProfile")} →</a>
          </div>
        </div>`;
    }

    async function startEnroll() {
      if (!me) { window.location.href = "login.html"; return; }
      if (Number(course.price) > 0) {
        openPayModal();
      } else {
        await apiFetch(`/api/courses/${courseId}/enroll`, { method: "POST" });
        await loadCourse();
      }
    }

    let currentQr = null;

    function openPayModal() {
      const modal = document.getElementById("pay-modal");
      modal.classList.remove("hidden");
      const body = document.getElementById("pay-body");
      body.innerHTML = `
        <div class="pay-summary">
          <div class="ps-row"><span class="ps-label" data-i18n="payCourse">Курс:</span><span>${escapeHtml(course.title)}</span></div>
          <div class="ps-row"><span class="ps-label" data-i18n="payAmount">К сумме оплате:</span></div>
          <div class="ps-amount">${fmtPrice(course.price)}</div>
        </div>
        <div class="pay-status"><div class="ps-icon">⏳</div><div class="ps-text" data-i18n="payQrGenerating">Генерируем QR-код...</div></div>
      `;
      applyI18n();
      startQrPayment();
    }

    async function startQrPayment() {
      const body = document.getElementById("pay-body");
      try {
        const res = await apiFetch(`/api/payment/sms-send`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ courseId: Number(courseId), payment: { method: "qr" } }),
        });
        currentQr = res.demoCode;
        body.innerHTML = `
          <div class="pay-summary">
            <div class="ps-row"><span class="ps-label" data-i18n="payCourse">Курс:</span><span>${escapeHtml(course.title)}</span></div>
            <div class="ps-row"><span class="ps-label" data-i18n="payAmount">К сумме оплате:</span></div>
            <div class="ps-amount">${fmtPrice(course.price)}</div>
          </div>
          <div class="qr-box">
            <img class="qr-img" src="${res.qrImage}" alt="QR">
            <div class="qr-text">${t("payQrText")}</div>
          </div>
          <button class="btn btn-primary" id="qr-paid-btn" style="width:100%">${t("payQrPaid")}</button>
          <div class="secure-note" data-i18n="paySecure">🔒 Демо-оплата. Реальные деньги не списываются.</div>
        `;
        applyI18n();
        document.getElementById("qr-paid-btn").addEventListener("click", () => showSmsStep(currentQr));
      } catch (err) {
        body.innerHTML = `<div class="pay-status"><div class="ps-icon">❌</div><div class="ps-text">${err.message}</div></div>`;
        applyI18n();
      }
    }

    function showSmsStep(demoCode) {
      const body = document.getElementById("pay-body");
      body.innerHTML = `
        <div class="pay-summary">
          <div class="ps-row"><span class="ps-label" data-i18n="payCourse">Курс:</span><span>${escapeHtml(course.title)}</span></div>
          <div class="ps-row"><span class="ps-label" data-i18n="payAmount">К сумме оплате:</span></div>
          <div class="ps-amount">${fmtPrice(course.price)}</div>
        </div>
        <div class="sms-notice" data-i18n="smsSent">📲 На ваш телефон отправлен SMS-код подтверждения оплаты. Введите его ниже.</div>
        <div class="demo-code-box">${t("smsDemoCode")}: <b>${demoCode}</b></div>
        <div class="form-group full">
          <label data-i18n="smsCodeLabel">SMS-код</label>
          <input id="sms-code" inputmode="numeric" maxlength="6" placeholder="••••••">
        </div>
        <button class="btn btn-primary" id="sms-btn" style="width:100%" data-i18n="smsConfirmBtn">Подтвердить оплату</button>
        <button class="btn btn-outline" id="sms-resend" style="width:100%;margin-top:8px" data-i18n="smsResend">Отправить код повторно</button>
      `;
      applyI18n();
      wireInputGuards();
      const input = document.getElementById("sms-code");
      input.focus();
      input.addEventListener("input", () => {
        input.value = input.value.replace(/\D/g, "").slice(0, 6);
        if (input.value.length === 6) document.getElementById("sms-btn").click();
      });
      document.getElementById("sms-btn").addEventListener("click", () => confirmSms(input.value));
      document.getElementById("sms-resend").addEventListener("click", async () => {
        try {
          const res = await apiFetch(`/api/payment/sms-send`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ courseId: Number(courseId), payment: { method: "qr" } }),
          });
          currentQr = res.demoCode;
          document.querySelector(".demo-code-box b").textContent = res.demoCode;
          alert(t("smsResent"));
        } catch (err) { alert(err.message); }
      });
    }

    async function confirmSms(code) {
      const btn = document.getElementById("sms-btn");
      if (!/^\d{6}$/.test(code)) { alert(t("smsCodeInvalid")); return; }
      btn.disabled = true;
      const body = document.getElementById("pay-body");
      body.innerHTML = `<div class="pay-status"><div class="ps-icon">⏳</div><div class="ps-text" data-i18n="payProcessing">Обработка платежа...</div></div>`;
      applyI18n();
      try {
        await apiFetch(`/api/payment/sms-confirm`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ courseId: Number(courseId), code }),
        });
        body.innerHTML = `<div class="pay-status"><div class="ps-icon">✅</div><div class="ps-text" data-i18n="paySuccess">Оплата прошла успешно!</div></div>`;
        applyI18n();
        setTimeout(async () => {
          document.getElementById("pay-modal").classList.add("hidden");
          await loadCourse();
        }, 1200);
      } catch (err) {
        body.innerHTML = `<div class="pay-status"><div class="ps-icon">❌</div><div class="ps-text">${err.message}</div></div>`;
        applyI18n();
        setTimeout(() => { document.getElementById("pay-modal").classList.add("hidden"); }, 1800);
      }
    }

    document.getElementById("pay-modal").addEventListener("click", (e) => {
      if (e.target === document.getElementById("pay-modal")) document.getElementById("pay-modal").classList.add("hidden");
    });

    let currentQuiz = [];

    function heroMediaHtml(c) {
      const media = (c.media || []).filter(m => m.type !== "audio");
      if (media.length > 0) {
        const slides = media.map(m => `
          <div class="mg-slide">
            ${m.type === "video"
              ? `<div class="media-wrap">${speedRow()}<video controls controlsList="nodownload" disablepictureinpicture oncontextmenu="return false" preload="metadata" src="${escapeHtml(m.url)}"></video></div>`
              : `<img src="${escapeHtml(m.url)}" alt="">`}
          </div>`).join("");
        return `
          <div class="media-gallery" id="media-gallery" data-count="${media.length}">
            <div class="mg-track">${slides}</div>
            <button class="mg-nav mg-prev" aria-label="${t("prev")}">‹</button>
            <button class="mg-nav mg-next" aria-label="${t("next")}">›</button>
            <div class="mg-dots">${media.map((_, i) => `<span class="mg-dot${i === 0 ? " active" : ""}" data-i="${i}"></span>`).join("")}</div>
            <div class="mg-count"><span class="mg-cur">1</span>/${media.length}</div>
          </div>`;
      }
      return `<img class="course-cover" src="${courseCover(c)}" alt="">`;
    }

    function setupGallery() {
      const gallery = document.getElementById("media-gallery");
      if (!gallery) return;
      const slides = gallery.querySelectorAll(".mg-slide");
      const dots = gallery.querySelectorAll(".mg-dot");
      const countEl = gallery.querySelector(".mg-cur");
      const total = slides.length;
      let index = 0;

      const show = (i) => {
        index = (i + total) % total;
        slides.forEach((s, j) => s.classList.toggle("active", j === index));
        dots.forEach((d, j) => d.classList.toggle("active", j === index));
        if (countEl) countEl.textContent = index + 1;
      };

      gallery.querySelector(".mg-prev").addEventListener("click", () => show(index - 1));
      gallery.querySelector(".mg-next").addEventListener("click", () => show(index + 1));
      dots.forEach(d => d.addEventListener("click", () => show(Number(d.dataset.i))));
      wireSpeed(gallery);

      if (window.__galleryKeyHandler) document.removeEventListener("keydown", window.__galleryKeyHandler);
      window.__galleryKeyHandler = (e) => {
        if (gallery.matches(":hover") && e.key === "ArrowLeft") show(index - 1);
        if (gallery.matches(":hover") && e.key === "ArrowRight") show(index + 1);
      };
      document.addEventListener("keydown", window.__galleryKeyHandler);

      let touchX = null;
      gallery.addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
      gallery.addEventListener("touchend", (e) => {
        if (touchX === null) return;
        const dx = e.changedTouches[0].clientX - touchX;
        if (dx > 40) show(index - 1);
        else if (dx < -40) show(index + 1);
        touchX = null;
      }, { passive: true });

      if (total <= 1) {
        gallery.querySelectorAll(".mg-nav, .mg-dots").forEach(el => el.style.display = "none");
      }
    }

    function showLesson(lessonId) {
      const lesson = course.lessons.find(l => l.id === lessonId);
      if (!lesson) return;
      const view = document.getElementById("lesson-view");
      currentQuiz = lesson.quiz || [];
      const fullAccess = !!course.enrolled || !!course.isAdmin;
      view.innerHTML = `
        <div class="lesson-view">
          <h3>${lesson.position + 1}. ${escapeHtml(lesson.title)}</h3>
          ${lesson.image_url ? `<img class="lesson-img" src="${escapeHtml(lesson.image_url)}" alt="">` : ""}
          ${lesson.video_url ? renderMedia(lesson.video_url) : ""}
          <div class="lesson-text">${nl2br(lesson.content)}</div>
          ${lesson.quiz && lesson.quiz.length ? renderQuiz(lesson.quiz) : ""}
          <div class="lesson-actions">
            ${fullAccess
              ? `<button class="btn btn-primary" id="complete-btn">${t("courseCompleted")} (${Math.round(((lesson.position + 1) / course.lessons.length) * 100)}%)</button>`
              : `<button class="btn btn-primary" id="full-access-btn">${t("fullAccess")}</button>`}
          </div>
          <div class="lesson-protect-note">🔒 ${t("lessonProtectNote")}</div>
          <div class="lesson-watermark" aria-hidden="true">${escapeHtml(me ? me.name : "")} · ${escapeHtml(course.title)}</div>
        </div>`;
      view.scrollIntoView({ behavior: "smooth", block: "start" });
      setupQuiz();
      wireSpeed(view);
      protectLesson(view);
      const completeBtn = document.getElementById("complete-btn");
      if (completeBtn) completeBtn.addEventListener("click", async () => {
        const data = await apiFetch(`/api/courses/${courseId}/progress`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ lessonId }),
        });
        course.progress = data.progress;
        renderCourse();
      });
      const fullAccessBtn = document.getElementById("full-access-btn");
      if (fullAccessBtn) fullAccessBtn.addEventListener("click", () => {
        if (!me) { window.location.href = "login.html"; return; }
        document.getElementById("enroll-btn")?.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    }

    function speedRow() {
      return `<div class="speed-row" role="group" aria-label="${t("speedLabel")}">
        ${[0.75, 1, 1.25, 1.5, 2].map(r => `<button type="button" data-rate="${r}" class="${r === 1 ? "active" : ""}">${r}×</button>`).join("")}
      </div>`;
    }

    // Защита урока от копирования и скачивания: отключает контекстное меню,
    // выделение текста, сочетания клавиш и перетаскивание, добавляет водяной знак.
    function protectLesson(root) {
      if (!root) return;
      root.querySelectorAll("video, audio").forEach(m => {
        m.setAttribute("controlsList", "nodownload noremoteplayback");
        m.setAttribute("disablepictureinpicture", "");
        m.oncontextmenu = () => false;
      });
      if (root.dataset.protected) return;
      root.dataset.protected = "1";
      const blocked = e => e.preventDefault();
      root.addEventListener("contextmenu", blocked);
      root.addEventListener("copy", blocked);
      root.addEventListener("cut", blocked);
      root.addEventListener("paste", blocked);
      root.addEventListener("dragstart", blocked);
      root.addEventListener("keydown", e => {
        if (e.ctrlKey && ["c", "x", "s", "p", "u", "a"].includes((e.key || "").toLowerCase())) e.preventDefault();
        if (e.key === "F12") e.preventDefault();
        if (e.ctrlKey && e.shiftKey && ["i", "j", "c", "k"].includes((e.key || "").toLowerCase())) e.preventDefault();
      });
      root.addEventListener("mousedown", e => {
        if (e.button === 2) e.preventDefault();
      });
    }

    function renderVideo(url) {
      let src = url.trim();
      const yt = src.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]+)/);
      if (yt) {
        return `<div class="video-wrap"><iframe src="https://www.youtube.com/embed/${yt[1]}" frameborder="0" allowfullscreen></iframe></div>`;
      }
      return `<div class="media-wrap">${speedRow()}<video class="video-wrap" controls controlsList="nodownload" disablepictureinpicture oncontextmenu="return false" preload="metadata"><source src="${escapeHtml(src)}"></video></div>`;
    }

    function renderMedia(url) {
      let src = url.trim();
      if (/\.(mp3|wav|m4a|aac|ogg|oga)$/i.test(src)) {
        return `<div class="media-wrap">${speedRow()}<audio class="audio-wrap" controls controlsList="nodownload" disablepictureinpicture oncontextmenu="return false" preload="metadata" src="${escapeHtml(src)}"></audio></div>`;
      }
      return renderVideo(src);
    }

    function wireSpeed(scope) {
      (scope || document).querySelectorAll(".media-wrap").forEach(wrap => {
        const media = wrap.querySelector("video, audio");
        if (!media) return;
        wrap.querySelectorAll(".speed-row button").forEach(btn => {
          btn.addEventListener("click", () => {
            try { media.playbackRate = Number(btn.dataset.rate); } catch (_) {}
            wrap.querySelectorAll(".speed-row button").forEach(b => b.classList.toggle("active", b === btn));
          });
        });
      });
    }

    function renderQuiz(quiz) {
      return `
        <div class="quiz-box card">
          <h4 class="quiz-title">📝 ${t("quizTitle")}</h4>
          ${quiz.map((q, qi) => `
            <div class="quiz-q" data-q="${qi}">
              <div class="qq-text">${qi + 1}. ${escapeHtml(q.q)}</div>
              ${q.options.map((o, oi) => `
                <label class="quiz-opt" data-opt="${oi}">
                  <input type="radio" name="q${qi}" value="${oi}">
                  <span>${escapeHtml(o)}</span>
                </label>`).join("")}
              <div class="qq-result hidden"></div>
            </div>`).join("")}
          <button class="btn btn-primary" id="quiz-check" style="width:100%">${t("quizCheck")}</button>
          <button class="btn btn-outline hidden" id="quiz-retry" style="width:100%;margin-top:8px">${t("quizRetry")}</button>
          <div class="quiz-score hidden"></div>
        </div>`;
    }

    function setupQuiz() {
      const checkBtn = document.getElementById("quiz-check");
      if (!checkBtn) return;
      checkBtn.addEventListener("click", () => {
        let correct = 0;
        const total = document.querySelectorAll(".quiz-q").length;
        document.querySelectorAll(".quiz-q").forEach((qEl, qi) => {
          const chosen = qEl.querySelector("input:checked");
          const resEl = qEl.querySelector(".qq-result");
          const optEls = qEl.querySelectorAll(".quiz-opt");
          optEls.forEach((o, oi) => o.classList.remove("right", "wrong"));
          if (!chosen) {
            resEl.innerHTML = `<span class="qwarn">⚠ ${t("quizNoAnswer")}</span>`;
            resEl.classList.remove("hidden");
            return;
          }
          const answer = Number(chosen.value);
          const right = currentQuiz[qi];
          if (typeof right.correct !== "number" || right.correct < 0) {
            resEl.innerHTML = `<span class="qwarn">⚠ ${t("quizNoCorrect")}</span>`;
            resEl.classList.remove("hidden");
            return;
          }
          const isRight = answer === right.correct;
          if (isRight) correct++;
          optEls.forEach((o, oi) => {
            if (oi === right.correct) o.classList.add("right");
            else if (oi === answer) o.classList.add("wrong");
          });
          resEl.innerHTML = isRight
            ? `<span class="qok">✅ ${t("quizRight")}</span>`
            : `<span class="qbad">❌ ${t("quizWrong")} — ${t("quizCorrectIs")}: ${escapeHtml(right.options[right.correct])}</span>`;
          resEl.classList.remove("hidden");
        });
        const score = document.querySelector(".quiz-score");
        score.textContent = `${t("quizResult")}: ${correct}/${total}` + (correct === total ? " 🎉" : "");
        score.classList.remove("hidden");
        const retry = document.getElementById("quiz-retry");
        retry.classList.remove("hidden");
        retry.addEventListener("click", () => {
          document.querySelectorAll(".quiz-q input").forEach(i => i.checked = false);
          document.querySelectorAll(".qq-result").forEach(el => el.classList.add("hidden"));
          document.querySelectorAll(".quiz-opt").forEach(o => o.classList.remove("right", "wrong"));
          document.querySelector(".quiz-score").classList.add("hidden");
          document.getElementById("quiz-retry").classList.add("hidden");
        }, { once: true });
      });
    }

    initTheme();
    renderNav();
    loadCourse();
  </script>
</body>
</html>
