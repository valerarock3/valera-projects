<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Восстановление пароля</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">MAGIC🌞SUN ELLEN</a>
    <div class="nav-links" id="nav-links"></div>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </nav>

  <div class="container">
    <div class="card form-card">
      <h2 class="page-title" data-i18n="resetTitle">Восстановление пароля</h2>
      <div class="form-error" id="form-error"></div>

      <div id="step-phone">
        <p class="form-hint" data-i18n="resetStep1">Введите email, привязанный к аккаунту</p>
        <div class="form-group">
          <label data-i18n="email">Email</label>
          <input type="email" id="reset-email" placeholder="you@example.com">
        </div>
        <button class="btn btn-primary" id="send-btn" data-i18n="sendCode">Отправить код</button>
        <div class="form-hint"><a href="login.html" data-i18n="backToLogin">Вернуться ко входу</a></div>
      </div>

      <div id="step-code" style="display:none">
        <p class="form-hint" id="code-sent-hint"></p>
        <div class="form-group">
          <label data-i18n="emailCodeLabel">Код из email</label>
          <input type="text" id="code" inputmode="numeric" placeholder="••••••">
        </div>
        <div class="form-group">
          <label data-i18n="resetNewPass">Новый пароль</label>
          <input type="password" id="newPassword" placeholder="••••••••">
        </div>
        <button class="btn btn-primary" id="confirm-btn" data-i18n="resetBtn">Сбросить пароль</button>
      </div>

      <div id="step-done" style="display:none">
        <p class="form-hint" id="done-msg"></p>
        <a class="btn btn-primary" href="login.html" data-i18n="backToLogin">Вернуться ко входу</a>
      </div>
    </div>
  </div>

  <script src="translations.js"></script>
  <script src="common.js"></script>
  <script>
    let demoCode = "";

    function showErr(msg) {
      const err = document.getElementById("form-error");
      err.textContent = msg;
      err.classList.add("show");
    }

    document.getElementById("send-btn").addEventListener("click", async (e) => {
      const btn = e.target;
      btn.disabled = true;
      const email = document.getElementById("reset-email").value.trim();
      try {
        const data = await apiFetch("/api/reset/send", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        demoCode = data.demoCode || "";
        document.getElementById("step-phone").style.display = "none";
        document.getElementById("step-code").style.display = "block";
        document.getElementById("code-sent-hint").textContent =
          t("resetCodeSent") + (demoCode ? " " + t("demoCodeLabel") + " " + demoCode : "");
      } catch (err) { showErr(err.message); }
      btn.disabled = false;
    });

    document.getElementById("confirm-btn").addEventListener("click", async (e) => {
      const btn = e.target;
      btn.disabled = true;
      const body = {
        email: document.getElementById("reset-email").value.trim(),
        code: document.getElementById("code").value.trim(),
        newPassword: document.getElementById("newPassword").value,
      };
      try {
        await apiFetch("/api/reset/confirm", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        document.getElementById("step-code").style.display = "none";
        document.getElementById("step-done").style.display = "block";
        document.getElementById("done-msg").textContent = t("resetSuccess");
      } catch (err) { showErr(err.message); }
      btn.disabled = false;
    });

    document.getElementById("newPassword").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("confirm-btn").click();
    });
    document.getElementById("reset-email").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("send-btn").click();
    });

    initTheme();
    applyI18n();
  </script>
</body>
</html>
