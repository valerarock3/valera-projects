<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Товары</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">MAGIC🌞SUN ELLEN</a>
    <div class="nav-links" id="nav-links"></div>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </nav>

  <div class="container">
    <div class="page-hero">
      <h1 data-i18n="products">Товары</h1>
    </div>
    <div class="card-grid" id="products-grid"><div class="loading" data-i18n="loading">Загрузка...</div></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <script src="translations.js"></script>
  <script src="common.js"></script>
  <script>
  const PER_PAGE = 12;
  let allProducts = [];

  function renderProducts() {
    const grid = document.getElementById("products-grid");
    const page = pageFromUrl();
    const total = Math.ceil(allProducts.length / PER_PAGE);
    const start = (page - 1) * PER_PAGE;
    const items = allProducts.slice(start, start + PER_PAGE);
    if (!items.length) { grid.innerHTML = `<div class="empty">${t("noProducts")}</div>`; return; }
    grid.innerHTML = items.map(p => `
      <div class="product-card" onclick="location.href='item.html?type=product&id=${p.id}'">
        <img src="${escapeHtml(p.image_url || "/uploads/product-default.svg")}" alt="" loading="lazy" onerror="this.onerror=null;this.src='/uploads/product-default.svg'">
        <div class="product-body">
          <div class="product-cat">${escapeHtml(p.category || "")}</div>
          <div class="product-name">${escapeHtml(p.name)}</div>
          <div class="product-desc">${escapeHtml(p.description || "")}</div>
          <div class="product-bottom">
            <span class="product-price">${fmtPrice(p.price)}</span>
            <span class="badge-stock ${p.in_stock ? "in" : "out"}">${p.in_stock ? t("inStock") : t("outOfStock")}</span>
          </div>
          <div class="product-actions">
            <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();location.href='item.html?type=product&id=${p.id}'">${t("details")}</button>
          </div>
        </div>
      </div>
    `).join("");
    renderPagination(document.getElementById("pagination"), Math.min(page, total), total, p => {
      const url = new URL(location.href);
      url.searchParams.set("page", p);
      location.href = url.toString();
    });
  }

  async function loadProducts() {
    const grid = document.getElementById("products-grid");
    grid.innerHTML = `<div class="loading">${t("loading")}</div>`;
    try {
      allProducts = await apiFetch("/api/products");
      renderProducts();
    } catch (err) {
      grid.innerHTML = `<div class="empty">${err.message}</div>`;
    }
  }
  loadProducts();
  </script>
</body>
</html>
