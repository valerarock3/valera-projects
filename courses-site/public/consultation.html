<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Консультация</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">🎓 Курсы</a>
    <div class="nav-links" id="nav-links"></div>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </nav>

  <div class="container">
    <div class="page-hero">
      <h1 data-i18n="sectionConsultation">Консультация специалиста</h1>
      <p class="page-sub" data-i18n="consultationSub">Индивидуальные консультации специалистов по любым вопросам</p>
    </div>
    <div class="card-grid" id="consultations-grid"><div class="loading" data-i18n="loading">Загрузка...</div></div>
  </div>

  <script src="translations.js"></script>
  <script src="common.js"></script>
  <script>

  async function loadConsultations() {
    const grid = document.getElementById("consultations-grid");
    grid.innerHTML = `<div class="loading">${t("loading")}</div>`;
    try {
      const data = await apiFetch("/api/consultations");
      if (!data.length) { grid.innerHTML = `<div class="empty">${t("noConsultations")}</div>`; return; }
      grid.innerHTML = data.map(c => `
        <div class="consult-card" onclick="location.href='item.html?type=consultation&id=${c.id}'">
          <span class="consult-title">${escapeHtml(c.title)}</span>
          <span class="consult-expert">${t("expert")}: ${escapeHtml(c.expert || "")}</span>
          <span class="consult-desc">${escapeHtml(c.description || "")}</span>
          <div class="consult-meta">
            <span>⏱ ${c.duration_min || 0} ${t("minLabel")}</span>
            <span class="price ${Number(c.price) === 0 ? "free" : ""}">${Number(c.price) === 0 ? t("free") : fmtPrice(c.price)}</span>
          </div>
          <div class="consult-footer">
            <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();location.href='item.html?type=consultation&id=${c.id}'">${t("details")}</button>
          </div>
        </div>
      `).join("");
    } catch (err) {
      grid.innerHTML = `<div class="empty">${err.message}</div>`;
    }
  }

  loadConsultations();
  </script>
</body>
</html>
