<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог курсов</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">🎓 Курсы</a>
    <div class="nav-links" id="nav-links"></div>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </nav>

  <div class="container">
    <h1 class="page-title" data-i18n="catalog">Каталог курсов</h1>
    <div class="courses-grid" id="courses-grid"><div class="loading" data-i18n="loading">Загрузка...</div></div>
  </div>

  <script src="translations.js"></script>
  <script src="common.js"></script>
  <script>
  async function loadCourses() {
    const grid = document.getElementById("courses-grid");
    grid.innerHTML = `<div class="loading">${t("loading")}</div>`;
    try {
      const data = await apiFetch("/api/courses");
      if (!data.length) { grid.innerHTML = `<div class="empty">${t("notFound")}</div>`; return; }
      grid.innerHTML = data.map(c => `
        <div class="course-card" onclick="location.href='course.html?id=${c.id}'">
          <img src="${courseCover(c)}" alt="">
          <div class="course-body">
            <div class="course-cat">${escapeHtml(c.category_name) || t("noCategory")}</div>
            <div class="course-title">${escapeHtml(c.title)}</div>
            <div class="course-desc">${escapeHtml((c.description || "").slice(0, 90))}</div>
            <div class="course-meta">
              <span class="course-price">${fmtPrice(c.price)}</span>
              <span class="course-info">${c.lessons_count || 0} ${pluralLessons(c.lessons_count || 0)}</span>
            </div>
            <div class="course-instructor">${escapeHtml(c.inst_name || (c.instructor_info && c.instructor_info.name) || "")}</div>
          </div>
        </div>
      `).join("");
    } catch (err) {
      grid.innerHTML = `<div class="empty">${err.message}</div>`;
    }
  }
  loadCourses();
  </script>
</body>
</html>
