<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Финансовый дашборд</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <button class="topbar-btn" id="recs-btn">
      <span class="topbar-icon">💡</span>
      <span class="topbar-label">Рекомендации</span>
    </button>
    <div class="topbar-center">
      <span class="topbar-title">Финансовый дашборд</span>
    </div>
    <button class="topbar-btn" id="profile-btn">
      <span class="topbar-avatar" id="topbar-avatar">👤</span>
      <span class="topbar-label">Профиль</span>
    </button>
  </div>

  <div class="container">
    <div class="main-tabs">
      <button class="tab active" data-tab="stocks">
        <span class="tab-icon">📈</span>
        <span class="tab-label">Акции</span>
        <span class="tab-desc">Доля в бизнесе</span>
      </button>
      <button class="tab" data-tab="crypto">
        <span class="tab-icon">₿</span>
        <span class="tab-label">Криптовалюта</span>
        <span class="tab-desc">Цифровые деньги</span>
      </button>
    </div>

    <div id="stocks" class="tab-content active">
      <div class="sort-bar"><span class="sort-label">Сортировка:</span><button class="sort-btn active" data-tab="stocks" data-sort="default">По умолчанию</button><button class="sort-btn" data-tab="stocks" data-sort="asc">↑ Цена</button><button class="sort-btn" data-tab="stocks" data-sort="desc">↓ Цена</button></div>
      <div class="card-grid" id="stocks-grid"></div>
    </div>
    <div id="crypto" class="tab-content">
      <div class="sort-bar"><span class="sort-label">Сортировка:</span><button class="sort-btn active" data-tab="crypto" data-sort="default">По умолчанию</button><button class="sort-btn" data-tab="crypto" data-sort="asc">↑ Цена</button><button class="sort-btn" data-tab="crypto" data-sort="desc">↓ Цена</button></div>
      <div class="card-grid" id="crypto-grid"></div>
    </div>
    <div id="recs" class="tab-content"></div>
    <div id="profile" class="tab-content"></div>
  </div>

  <div id="detail-overlay" class="overlay hidden">
    <div class="overlay-header">
      <button class="back-btn" id="back-btn">← Назад</button>
      <span id="detail-title" class="detail-title"></span>
    </div>
    <div class="overlay-body">
      <div class="detail-actions">
        <button class="action-btn" id="detail-fav-btn">☆ В избранное</button>
        <button class="action-btn buy-btn" id="detail-buy-btn">+ Купить</button>
      </div>
      <div class="detail-price-bar">
        <div>
          <span id="detail-price" class="detail-price"></span>
          <span id="detail-change" class="detail-change"></span>
        </div>
        <div id="detail-cap" class="detail-cap"></div>
      </div>
      <div class="chart-section">
        <div class="chart-rec-layout">
          <div class="chart-rec-main">
            <div class="chart-controls">
              <button class="chart-btn active" data-range="1d">День</button>
              <button class="chart-btn" data-range="5d">5 дней</button>
              <button class="chart-btn" data-range="1mo">Месяц</button>
              <button class="chart-btn" data-range="6mo">6 мес</button>
              <button class="chart-btn" data-range="1y">Год</button>
            </div>
            <div class="chart-wrap"><canvas id="chart-canvas"></canvas></div>
          </div>
          <div id="detail-rec-panel" class="rec-panel hidden">
            <div class="rec-panel-badge" id="rec-panel-badge"></div>
            <div class="rec-panel-title" id="rec-panel-title"></div>
            <div class="rec-panel-reason" id="rec-panel-reason"></div>
            <div class="rec-panel-signals" id="rec-panel-signals"></div>
            <div class="rec-panel-score" id="rec-panel-score"></div>
            <div class="rec-panel-advice" id="rec-panel-advice"></div>
          </div>
        </div>
      </div>
      <div class="news-section">
        <h3>📰 Новости</h3>
        <div id="news-list" class="news-list"><div class="loading">Загрузка...</div></div>
      </div>
      <div class="comments-section">
        <h3>💬 Комментарии</h3>
        <div class="comment-input-wrap">
          <div class="comment-avatar-sm" id="comment-self-avatar">👤</div>
          <input type="text" id="comment-input" class="comment-input" placeholder="Напишите комментарий..." maxlength="500">
          <button class="comment-send" id="comment-send-btn">→</button>
        </div>
        <div id="comments-list" class="comments-list"><div class="loading">Загрузка...</div></div>
      </div>
    </div>
  </div>

  <div id="commenter-popup" class="popup hidden">
    <div class="popup-arrow"></div>
    <div class="popup-avatar" id="popup-avatar"></div>
    <div class="popup-name" id="popup-name"></div>
    <div class="popup-stat"><span class="popup-label">На платформе:</span> <span id="popup-time"></span></div>
    <div class="popup-stat"><span class="popup-label">Заработано:</span> <span id="popup-earnings"></span></div>
  </div>

  <div id="buy-modal" class="modal hidden">
    <div class="modal-overlay" id="buy-modal-overlay"></div>
    <div class="modal-body">
      <h3 id="buy-modal-title">Покупка</h3>
      <div class="buy-price">Цена: $<span id="buy-price-display">0</span></div>
      <div class="buy-input-group">
        <label>Количество</label>
        <input type="number" id="buy-quantity" value="1" min="1" step="1">
      </div>
      <div class="buy-total">Итого: $<span id="buy-total">0</span></div>
      <div class="buy-actions">
        <button class="action-btn" id="buy-cancel">Отмена</button>
        <button class="action-btn buy-btn" id="buy-confirm">✅ Купить</button>
      </div>
    </div>
  </div>

  <div class="currency-bar">
    <div class="currency-title">Курсы валют</div>
    <div id="currency-items" class="currency-items"><div class="loading" style="padding:8px">Загрузка...</div></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
